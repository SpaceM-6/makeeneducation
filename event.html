<footer>شركة مكين للاستشارات والتدريب والتعليم · <a href="index.html">الرئيسية</a> · <a href="calendar.html">التقويم الإسلامي</a></footer>

<script>
(function () {
  var I = window.MNIslamic, D = window.MN_EVDETAILS || {}, AR = I.toAr;
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var id = (location.search.match(/[?&]id=([a-z]+)/) || [])[1], d = D[id], main = document.getElementById('main');
  if (!d) { main.innerHTML = '<div class="missing"><h2>لم نجد هذه الصفحة</h2><a class="btn" href="calendar.html">العودة إلى التقويم الإسلامي</a></div>'; return; }
  document.title = d.t + ' | التقويم الإسلامي — شركة مكين للاستشارات والتدريب والتعليم';
  var occ = I.OCC.concat(I.INFO).filter(function (o) { return o.id === id; })[0];
  var kind = occ ? I.KINDS[occ.k] : 'من تاريخنا الإسلامي';
  var sup = function (ix) { return ix.map(function (i) { return '<sup><a href="#src' + (i + 1) + '">[' + AR(i + 1) + ']</a></sup>'; }).join(''); };
  var h = '<section class="hero"><div class="k">' + kind + '</div><h1>' + esc(d.t) + '</h1><span class="d">📅 ' + esc(d.sub) + '</span></section>';
  h += '<nav class="toc">' + d.sec.map(function (s, i) { return '<a href="#s' + i + '">' + esc(s[0]) + '</a>'; }).join('') + '<a href="#sources">المصادر</a></nav>';
  d.sec.forEach(function (s, i) {
    var body = s[1].map(function (it) { return typeof it === 'string' ? '<p>' + esc(it) + '</p>' : '<div class="qv">﴿' + esc(it.q) + '﴾<small>[' + esc(it.ref) + ']</small></div>'; }).join('');
    h += '<section class="s" id="s' + i + '"><h2><span class="n">' + AR(i + 1) + '</span>' + esc(s[0]) + '</h2>' + body + '<div style="text-align:left">' + sup(s[2]) + '</div></section>';
  });
  h += '<div class="srcs" id="sources"><h2>📚 المصادر</h2><ol>' + d.src.map(function (x, i) { return '<li id="src' + (i + 1) + '"><a href="' + x[1] + '" target="_blank" rel="noopener">' + esc(x[0]) + '</a></li>'; }).join('') + '</ol><p>الروابط تفتح الصفحة نفسها من الكتاب في المكتبة الشاملة. والأرقام [١] [٢] في آخر كل فقرة تدل على مصدرها.</p></div>';
  // السابق والتالي بترتيب التاريخ
  var order = Object.keys(D).sort(function (a, b) { return (D[a].ord || 0) - (D[b].ord || 0); });
  var p = order.indexOf(id), pv = order[p - 1], nx = order[p + 1];
  h += '<div class="nav2">' + (pv ? '<a href="event.html?id=' + pv + '"><small>→ السابق</small>' + esc(D[pv].t) + '</a>' : '<span></span>') + (nx ? '<a class="nx" href="event.html?id=' + nx + '"><small>التالي ←</small>' + esc(D[nx].t) + '</a>' : '<span></span>') + '</div>';
  h += '<div class="btns"><a class="btn" href="calendar.html' + (occ && occ.d ? '' : '') + '">📅 العودة إلى التقويم</a><button class="btn ghost" id="shareBtn" type="button">مشاركة الصفحة</button></div>';
  main.innerHTML = h;
  document.getElementById('shareBtn').onclick = function () {
    var u = location.origin + location.pathname.replace(/[^/]*$/, '') + 'event.html?id=' + id, t = d.t + ' — من التقويم الإسلامي في شركة مكين للاستشارات والتدريب والتعليم';
    if (navigator.share) navigator.share({ title: d.t, text: t, url: u }).catch(function () {});
    else { try { navigator.clipboard.writeText(t + '\n' + u); this.textContent = 'نُسخ الرابط ✓'; } catch (e) {} }
  };
})();
</script>

<script id="mkGold">/* توحيد ذهبي الشريط العلوي مع ذهبي القائمة الجانبية (#C9A45C) في كل صفحات مكين */
(function () {
  var BRIGHT = /243, 211, 122|229, 193, 88/, G = '#C9A45C', G2 = '#B8935A';
  function fix() {
    document.querySelectorAll('header, header *, .mk-top, .mk-top *').forEach(function (e) {
      var c = getComputedStyle(e);
      if (BRIGHT.test(c.color)) e.style.setProperty('color', G, 'important');
      if (BRIGHT.test(c.backgroundColor)) e.style.setProperty('background-color', G, 'important');
      if (BRIGHT.test(c.backgroundImage)) e.style.setProperty('background-image', 'linear-gradient(90deg,' + G + ',' + G2 + ')', 'important');
      ['Top', 'Right', 'Bottom', 'Left'].forEach(function (s) {
        if (BRIGHT.test(c['border' + s + 'Color'])) e.style.setProperty('border-' + s.toLowerCase() + '-color', G, 'important');
      });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fix); else fix();
  window.addEventListener('load', function () { fix(); setTimeout(fix, 1500); });
})();
</script>
