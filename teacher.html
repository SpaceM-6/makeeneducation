<meta property="og:type" content="website"><meta property="og:site_name" content="شركة مكين"><meta property="og:locale" content="ar_AR"><meta property="og:title" content="الصفحة التعريفية للمعلم/ة | شركة مكين"><meta property="og:description" content="شركة مكين للاستشارات والتدريب والتعليم: برامج القرآن الكريم وعلومه والعلوم الشرعية واللغة العربية عن بُعد."><meta property="og:image" content="https://spacem-6.github.io/makeeneducation/icons/icon-512.png"><meta property="og:image:width" content="512"><meta property="og:image:height" content="512"><meta name="twitter:card" content="summary">
<link rel="icon" href="favicon.ico" sizes="48x48"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MakeenEducation"><script src="pwa.js" defer></script>

<link rel="stylesheet" href="mk.css?v=fce989d7">
<script src="mk-common.js?v=d155657b"></script>
<script>window.MN_CFG={site:/(^|\.)maimoonah\.com$/.test(location.hostname)?"maimouna":"makeen",base:"https://maimoonah.com",app:"تطبيق MakeenEducation",icon:"assets/makeen-logo.jpeg",badge:"assets/makeen-logo.jpeg",today:"today.html",my:"my.html",logo:"#mk-no-header-flag"};</script>
<script src="https://maimoonah.com/js/items.js"></script>
<script src="https://maimoonah.com/js/app.js"></script>
<script src="https://maimoonah.com/js/dailypick.js"></script>
<script src="https://maimoonah.com/js/daily.js" defer></script>
<script src="https://maimoonah.com/js/bookalerts.js" defer></script>
</head>
<body data-daily-popup data-app-bar>
<script>document.write(MK.header('teachers.html'))</script>
<main class="mk-wrap" id="main"><p class="mk-msg">جارٍ التحميل…</p></main>
<footer class="mk-foot">© شركة مكين للاستشارات والتدريب والتعليم</footer>
<script>

var BOOKS_HTML = (function () {
  var M = 'https://maimoonah.com/', L = [
    ['ihya', 'إحياء العقل السليم بكلام الخلاق العليم', 'book-cover.jpg?v=2', 'صدر مطبوعًا ورقميًا · ويصدر صوتيًا قريبًا'],
    ['tadabbur', 'تدبر التنزيل لأهل العصر والتأويل', 'img/cover-tadabbur.jpg', 'يصدر مطبوعًا ورقميًا وصوتيًا قريبًا'],
    ['ghina', 'الغنى والفقر تحت المجهر', 'img/cover-ghina.jpg', 'يصدر مطبوعًا ورقميًا وصوتيًا قريبًا'],
    ['kalima', 'الكلمة: من اللحظة إلى المصير', 'img/cover-kalima-tree2.jpg', 'يصدر مطبوعًا ورقميًا وصوتيًا قريبًا'],
    ['ihya-en', 'إحياء العقل السليم — النسخة الإنجليزية', 'img/cover-ihya-en-front.jpg?v=2', 'يصدر مطبوعًا ورقميًا وصوتيًا قريبًا']
  ];
  return '<section class="mk-box" id="books"><h2>كتب ومؤلفات</h2><div class="mk-books">' + L.map(function (b) {
    return '<a class="mk-book" href="' + M + '#book-' + b[0] + '"><img src="' + M + b[2] + '" alt="غلاف ' + b[1] + '" loading="lazy"><b>' + b[1] + '</b><small>' + b[3] + '</small></a>';
  }).join('') + '</div></section>';
})();
(function () {
  var id = new URLSearchParams(location.search).get('id') || '';
  var main = document.getElementById('main'), E = MK.esc;
  if (!/^[0-9a-f-]{36}$/i.test(id)) { main.innerHTML = '<p class="mk-msg">الصفحة غير موجودة. <a href="teachers.html">عودة إلى المعلمين</a></p>'; return; }
  var q = 'id=eq.' + id;
  Promise.all([
    MK.get('mk_teachers?select=*&published=eq.true&' + q),
    MK.get('mk_teacher_stats?select=*&teacher_id=eq.' + id).catch(function () { return []; }),
    MK.get('mk_reviews?select=first_name,stars,comment,created_at&approved=eq.true&teacher_id=eq.' + id + '&order=created_at.desc&limit=50').catch(function () { return []; })
  ]).then(function (r) {
    var t = (r[0] || [])[0];
    if (!t) { main.innerHTML = '<p class="mk-msg">هذه الصفحة غير متاحة حاليًا. <a href="teachers.html">عودة إلى المعلمين</a></p>'; return; }
    var s = (r[1] || [])[0] || {}, revs = r[2] || [];
    document.title = MK.title(t) + ' | معلمو مكين';
    var sec = function (h, v) { return v ? '<section class="mk-box"><h2>' + h + '</h2><p class="mk-pre">' + E(v) + '</p></section>' : ''; };
    var she = t.gender === 'f';
    main.innerHTML =
      '<section class="mk-box" data-item="teacher:' + t.id + '" data-title="' + E(MK.title(t)) + '" data-sub="' + E(t.headline || '') + '" data-url="teacher.html?id=' + t.id + '" data-img="' + E(t.photo_url || '') + '"><div class="mk-prof">' + MK.avatar(t, 120) + '<div style="flex:1;min-width:200px">' +
        (t.badge || t.is_head ? '<span class="mk-badge">' + E(t.badge || 'على رأس الكادر التعليمي') + '</span>' : '') +
        '<h1>' + E(MK.title(t)) + '</h1>' + (t.headline ? '<p class="mk-head" style="font-size:15.5px">' + E(t.headline) + '</p>' : '') +
        (t.level || t.specialty ? '<p class="mk-head">' + E([t.level, t.specialty].filter(Boolean).join(' · ')) + '</p>' : '') +
        '<div>' + MK.progStarsHtml((t.programs || []).length) + '</div>' + (s.n ? '<div>' + MK.stars(s.avg_stars, s.n) + ' <small>من آراء الطلاب</small></div>' : '') + '</div></div>' +
        '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><a class="mk-btn" href="programs.html">احجز/ي مع ' + E(MK.title(t)) + '</a><a class="mk-btn ghost" href="teachers.html">كل المعلمين والمعلمات</a></div></section>' +
      sec(she ? 'نبذة عنها' : 'نبذة عنه', t.bio) + (t.is_head ? BOOKS_HTML : '') + sec('المؤهلات العلمية', t.quals) + sec('الإجازات والأسانيد', t.ijazat) + sec('الخبرة', t.experience) +
      ((t.programs || []).length ? '<section class="mk-box"><h2>البرامج التي ' + (she ? 'تدرّسها' : 'يدرّسها') + '</h2><div class="mk-tags" style="justify-content:flex-start">' + t.programs.map(function (p) { return '<a class="mk-tag" style="text-decoration:none;font-size:13.5px" href="programs.html">' + E(p) + '</a>'; }).join('') + '</div></section>' : '') +
      '<section class="mk-box"><h2>آراء الطلاب والطالبات</h2>' +
        (revs.length ? revs.map(function (v) {
          var st = ''; for (var i = 1; i <= 5; i++) st += '<span class="' + (i <= v.stars ? 'on' : '') + '">★</span>';
          return '<div class="mk-rev"><b>' + E(v.first_name) + '</b> <span class="mk-stars">' + st + '</span> <small>' + new Date(v.created_at).toLocaleDateString('ar-EG', { year: 'numeric', month: 'long' }) + '</small>' + (v.comment ? '<p class="mk-pre">' + E(v.comment) + '</p>' : '') + '</div>';
        }).join('') : '<p class="mk-nostars" style="margin:0">لا تقييمات منشورة بعد.</p>') +
        '<p class="hint" style="font-size:12.5px;color:var(--muted);margin:10px 0 0">التقييمات من طلاب درسوا فعلًا مع ' + (she ? 'المعلمة' : 'المعلم') + '، ويكتبونها من لوحة الطالب، وتراجعها إدارة مكين قبل نشرها.</p></section>';
    if (window.MNItems) MNItems.mount(main);
    if (location.hash === '#books') { var bk = document.getElementById('books'); if (bk) setTimeout(function () { bk.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 200); }
  }).catch(function () { main.innerHTML = '<p class="mk-msg">تعذّر التحميل، حاول/ي مرة أخرى.</p>'; });
})();
</script>
</body>
</html>
