<body data-app-bar>
<header><a class="brand" href="teacher-panel.html"><img src="assets/makeen-logo.webp" alt="شعار شركة مكين"><span>تسجيل درس اليوم</span></a><a class="btn sm ghost" id="backBtn" href="teacher-panel.html" style="background:transparent;color:var(--gold);border-color:rgba(243,211,122,.6)">→ لوحة المعلم</a></header>
<main><div id="root"><section class="card">جارٍ التحميل…</section></div></main>
<script src="https://maimoonah.com/js/vendor/supabase-2.45.4.js"></script>

<script>window.MN_CFG={site:"makeen",base:"https://maimoonah.com",app:"تطبيق MakeenEducation",icon:"assets/makeen-logo.jpeg",badge:"assets/makeen-logo.jpeg",today:"today.html",my:"my.html",logo:"#mk-no-header-flag"};</script>
<script src="https://maimoonah.com/js/app.js?v=2026112606"></script>
<script src="https://maimoonah.com/js/sb.js?v=d8"></script>
<script src="https://maimoonah.com/js/pwlogin.js?v=9"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const AR = (n) => String(n).replace(/[0-9]/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
  const MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
  const DAYS = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  const dayLong = (d) => { const [y, m, dd] = d.split('-').map(Number); const dt = new Date(Date.UTC(y, m - 1, dd)); return `${DAYS[dt.getUTCDay()]} ${AR(dd)} ${MONTHS[m - 1]} ${AR(y)}م`; };
  const KINDS = ['حفظ', 'مراجعة', 'تلاوة وتصحيح', 'تجويد', 'تثبيت وسرد', 'تدبر وتفسير'];
  const GRADES = ['ممتاز', 'جيد جدًا', 'جيد', 'يحتاج مراجعة'];
  const qs = new URLSearchParams(location.search);
  const today = () => new Date().toLocaleDateString('en-CA', { timeZone: (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { return 'Africa/Cairo'; } })() });
  const sb = MN.sb();
  let META = null, QT = null, SUBS = [], CUR = null, F = {};

  // آية = "سورة:آية"
  const parse = (p) => { const m = /^(\d+):(\d+)$/.exec(p || ''); return m ? { s: +m[1], a: +m[2] } : null; };
  const pos = (p) => { const x = parse(p); return x && META ? `${META.ch[x.s - 1][0]} ${AR(x.a)}` : ''; };
  const rng = (f, t) => { const a = parse(f), b = parse(t); if (!a) return ''; if (!b || (a.s === b.s && a.a === b.a)) return pos(f); return a.s === b.s ? `${META.ch[a.s - 1][0]} ${AR(a.a)}–${AR(b.a)}` : `${pos(f)} إلى ${pos(t)}`; };
  const surahOpts = (sel) => '<option value="">— السورة —</option>' + META.ch.map((c, i) => `<option value="${i + 1}"${sel === i + 1 ? ' selected' : ''}>${AR(i + 1)}. ${c[0]}</option>`).join('');
  function ayahPick(key, label) {
    const x = parse(F[key]) || {};
    const max = x.s ? META.ch[x.s - 1][1] : 0;
    return `<div><label>${label}</label><div class="ayr"><select data-s="${key}" aria-label="${label}: السورة">${surahOpts(x.s)}</select><select data-a="${key}" aria-label="${label}: الآية"${x.s ? '' : ' disabled'}>${x.s ? Array.from({ length: max }, (_, i) => `<option value="${i + 1}"${x.a === i + 1 ? ' selected' : ''}>آية ${AR(i + 1)}</option>`).join('') : '<option>الآية</option>'}</select></div></div>`;
  }

  // سؤال اليوم: يُكتب تلقائيًا من نصاب الدرس أو الواجب (نص الآيات منقول من المصحف كما هو)
  async function quranText() { if (QT) return QT; QT = await fetch('https://maimoonah.com/data/quran-uthmani.json').then((r) => r.json()); return QT; }
  function ayatIn(from, to) {
    const a = parse(from), b = parse(to || from); if (!a || !b) return [];
    const out = []; let s = a.s, n = a.a;
    for (let i = 0; i < 700; i++) { out.push({ s, a: n }); if (s === b.s && n === b.a) break; n++; if (n > META.ch[s - 1][1]) { s++; n = 1; if (s > 114) break; } }
    return out;
  }
  async function autoQuestion() {
    const list = F.taken_from ? ayatIn(F.taken_from, F.taken_to) : F.hw_from ? ayatIn(F.hw_from, F.hw_to) : [];
    if (!list.length) return '';
    const Q = await quranText();
    const ok = list.filter((x) => Q[x.s - 1][x.a - 1].split(/\s+/).length >= 6);
    const pool = ok.length ? ok : list, pick = pool[Math.floor(Math.random() * pool.length)];
    const words = Q[pick.s - 1][pick.a - 1].split(/\s+/), head = words.slice(0, Math.min(4, Math.max(2, words.length - 2))).join(' ');
    const kinds = [
      () => `أكمل/ي الآية: «${head} …» ثم اذكر/ي اسم السورة ورقم الآية.`,
      () => `أكمل/ي من حفظك: «${head} …»، واذكر/ي حكمًا تجويديًا في الآية مع موضعه.`,
      () => `ما الآية التي تلي قوله تعالى: «${words.join(' ')}» في سورة ${META.ch[pick.s - 1][0]}؟`
    ];
    if (pick.a >= META.ch[pick.s - 1][1]) kinds.pop();
    return kinds[Math.floor(Math.random() * kinds.length)]();
  }

  function loadForm(day) {
    const ex = CUR ? (CUR.lessons || []).find((l) => l.day === day) : null;
    F = ex ? Object.assign({}, ex) : { day, taken_kind: '', hw_kind: 'حفظ' };
    F.day = day; F._existing = !!ex;
  }
  function render() {
    const prev = CUR ? (CUR.lessons || []).filter((l) => l.day < F.day).sort((a, b) => (a.day < b.day ? 1 : -1))[0] : null;
    $('root').innerHTML = `<section class="card"><h1>📝 درس اليوم والواجب</h1><p class="muted">يُرسل كل ما تسجّله/تسجّلينه هنا إلى لوحة الطالب/ة مباشرة، ومعه سؤال اليوم.</p></section>
    <div class="lf">
      <div class="blk"><div class="two"><div><label for="fSub">الطالب/ة</label><select id="fSub"><option value="">— اختر/اختاري —</option>${SUBS.map((s) => `<option value="${s.sub_id}"${CUR && CUR.sub_id === s.sub_id ? ' selected' : ''}>${esc(s.first_name)} · ${esc(s.program || '')}</option>`).join('')}</select></div>
        <div><label for="fDay">تاريخ الحصة</label><input type="date" id="fDay" value="${F.day}"></div></div>
        <p class="hint" style="margin-top:6px">📅 ${dayLong(F.day)}${F._existing ? ' — <b>سُجّل درس لهذا اليوم من قبل، ويمكنك تعديله</b>' : ''}</p>
        ${prev ? `<div class="prev" style="margin-top:8px"><b>الحصة السابقة (${dayLong(prev.day)}):</b> ${prev.stop_at ? 'توقفنا عند ' + esc(pos(prev.stop_at)) : ''}${prev.hw_from ? ' · الواجب: ' + esc((prev.hw_kind ? prev.hw_kind + ' ' : '') + rng(prev.hw_from, prev.hw_to)) : ''}${prev.summary ? '<br>' + esc(prev.summary) : ''}</div>` : ''}</div>

      <div class="blk"><b>📖 درس اليوم</b>
        <div class="two">${ayahPick('taken_from', 'من')}${ayahPick('taken_to', 'إلى')}</div>
        ${ayahPick('stop_at', 'توقفنا عند')}
        <label for="fSummary">ملخص الدرس</label><textarea id="fSummary" placeholder="مثال: حفظ الآيات مع تطبيق أحكام النون الساكنة والتنوين">${esc(F.summary || '')}</textarea>
        <label for="fGrade">التقدير</label><select id="fGrade"><option value="">—</option>${GRADES.map((g) => `<option${F.grade === g ? ' selected' : ''}>${g}</option>`).join('')}</select></div>

      <div class="blk"><b>🏠 الواجب</b>
        <label for="fKind">نوع الواجب</label><select id="fKind">${KINDS.map((k) => `<option${(F.hw_kind || 'حفظ') === k ? ' selected' : ''}>${k}</option>`).join('')}</select>
        <div class="two">${ayahPick('hw_from', 'من')}${ayahPick('hw_to', 'إلى')}</div></div>

      <div class="blk"><b>🗒 الملاحظات</b><textarea id="fNotes" placeholder="مثال: أحسنتِ في المدود، وانتبهي لمخرج الضاد">${esc(F.notes || '')}</textarea></div>

      <div class="blk q-box"><b>❓ سؤال اليوم</b><p class="hint" style="margin:0 0 6px">يُكتب تلقائيًا من آيات الدرس، ويظهر للطالب/ة في لوحته/ا. يمكنك تعديله أو تغييره.</p>
        <textarea id="fQ" placeholder="اختر/اختاري آيات الدرس أولًا، فيُكتب السؤال تلقائيًا">${esc(F.question || '')}</textarea>
        <div class="row-btns" style="margin-top:6px"><button type="button" class="btn sm ghost" id="qNew">🔄 سؤال آخر</button></div></div>

      <div class="save-bar"><button type="button" class="btn" id="saveBtn">💾 حفظ وإرسال للطالب/ة</button><label style="display:flex;gap:6px;align-items:center;font-weight:700;font-size:14px"><input type="checkbox" id="fNotify" ${F._existing ? '' : 'checked'} style="width:auto"> إشعار الطالب/ة بالواجب</label><span class="msg" id="msg"></span></div>
    </div>`;
    wire();
  }
  const keep = () => { const g = (id) => { const e = $(id); return e ? e.value : ''; }; F.summary = g('fSummary'); F.grade = g('fGrade'); F.hw_kind = g('fKind'); F.notes = g('fNotes'); F.question = g('fQ'); };
  async function setAuto(force) { if (!force && F.question) return; const q = await autoQuestion(); if (q) { F.question = q; const e = $('fQ'); if (e) e.value = q; } }
  function wire() {
    $('fSub').onchange = (e) => { keep(); CUR = SUBS.find((s) => String(s.sub_id) === e.target.value) || null; loadForm(F.day); render(); };
    $('fDay').onchange = (e) => { if (!e.target.value) return; keep(); loadForm(e.target.value); render(); };
    document.querySelectorAll('[data-s]').forEach((sel) => sel.onchange = () => {
      keep(); const k = sel.dataset.s, s = Number(sel.value);
      F[k] = s ? s + ':1' : '';
      if (k === 'taken_from' && s && !F.taken_to) F.taken_to = s + ':1';
      if (k === 'hw_from' && s && !F.hw_to) F.hw_to = s + ':1';
      render();
    });
    document.querySelectorAll('[data-a]').forEach((sel) => sel.onchange = () => {
      keep(); const k = sel.dataset.a, x = parse(F[k]); if (!x) return; F[k] = x.s + ':' + sel.value;
      if (k === 'taken_to' && !F._stopTouched) F.stop_at = F.taken_to;
      if (k === 'stop_at') F._stopTouched = true;
      render(); if (/^taken_|^hw_/.test(k)) setAuto(false);
    });
    $('qNew').onclick = async () => { keep(); const b = $('qNew'); b.disabled = true; await setAuto(true); b.disabled = false; if (!F.question) msg('اختر/اختاري آيات الدرس أو الواجب أولًا.', true); };
    $('saveBtn').onclick = save;
  }
  function msg(t, bad) { const m = $('msg'); m.style.color = bad ? '#B91C1C' : '#166534'; m.textContent = t; }
  const order = (f, t) => { const a = parse(f), b = parse(t); if (a && b && (b.s < a.s || (b.s === a.s && b.a < a.a))) return [t, f]; return [f, t]; };
  async function save() {
    keep();
    if (!CUR) return msg('اختر/اختاري الطالب/ة أولًا.', true);
    if (!F.taken_from && !F.summary && !F.hw_from && !F.notes) return msg('اكتب/ي درس اليوم أو الواجب قبل الحفظ.', true);
    [F.taken_from, F.taken_to] = order(F.taken_from, F.taken_to); [F.hw_from, F.hw_to] = order(F.hw_from, F.hw_to);
    if (!F.question) await setAuto(true);
    const b = $('saveBtn'); b.disabled = true; msg('جارٍ الحفظ…');
    const p = { sub_id: CUR.sub_id, day: F.day, taken_from: F.taken_from || '', taken_to: F.taken_to || '', hw_from: F.hw_from || '', hw_to: F.hw_to || '', hw_kind: F.hw_from ? (F.hw_kind || '') : '', stop_at: F.stop_at || '',
      grade: F.grade || '', notes: (F.notes || '').trim(), summary: (F.summary || '').trim(), question: (F.question || '').trim(), notify: $('fNotify').checked ? 'true' : 'false', hw_label: F.hw_from ? (F.hw_kind || '') + ' ' + rng(F.hw_from, F.hw_to) : '' };
    const { error } = await sb.rpc('save_lesson', { p });
    b.disabled = false;
    if (error) return msg('تعذّر الحفظ: ' + error.message, true);
    const rec = Object.assign({}, p); delete rec.notify; delete rec.hw_label;
    CUR.lessons = (CUR.lessons || []).filter((l) => l.day !== F.day); CUR.lessons.unshift(rec); F._existing = true;
    msg('✓ حُفظ الدرس، ووصل الواجب وسؤال اليوم إلى لوحة الطالب/ة.');
  }

  async function boot() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { location.href = $('backBtn').getAttribute('href'); return; }
    try { await MN.pwGate(sb, session); } catch (e) {}
    try {
      const [meta, dash] = await Promise.all([fetch('https://maimoonah.com/data/quran-meta.json').then((r) => r.json()), sb.rpc('teacher_dashboard')]);
      META = meta;
      if (dash.error || !dash.data || dash.data.error) { $('root').innerHTML = '<section class="card">هذه الصفحة لمعلمي مكين. ادخل/ي من لوحة المعلم بالبريد المسجّل في كادر مكين.</section>'; return; }
      SUBS = (dash.data.students || []).filter((x) => x.status === 'active');
    } catch (e) { $('root').innerHTML = '<section class="card">تعذّر التحميل، تأكد/ي من الإنترنت ثم حدّث/ي الصفحة.</section>'; return; }
    CUR = SUBS.find((s) => String(s.sub_id) === qs.get('sub')) || (SUBS.length === 1 ? SUBS[0] : null);
    const d = qs.get('day'); loadForm(d && /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : today());
    if (CUR) $('backBtn').href = $('backBtn').getAttribute('href') + '#stu-' + CUR.sub_id;
    render();
  }
  boot();
</script>
<script id="mkGold">/* توحيد ذهبي الشريط العلوي مع ذهبي القائمة الجانبية (#C9A45C) في كل صفحات مكين */
(function () {
  var BRIGHT = /243, 211, 122|229, 193, 88/, G = '#C9A45C', G2 = '#B8935A';
  function fix() {
    document.querySelectorAll('header, header *, .mk-top, .mk-top *').forEach(function (e) {
      var c = getComputedStyle(e);
      if (BRIGHT.test(c.color)) e.style.setProperty('color', G, 'important');
      if (BRIGHT.test(c.backgroundColor)) e.style.setProperty('background-color', G, 'important');
      if (BRIGHT.test(c.backgroundImage)) e.style.setProperty('background-image', 'linear-gradient(90deg,' + G + ',' + G2 + ')', 'important');
      ['Top', 'Right', 'Bottom', 'Left'].forEach(function (s) {
        if (BRIGHT.test(c['border' + s + 'Color'])) e.style.setProperty('border-' + s.toLowerCase() + '-color', G, 'important');
      });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fix); else fix();
  window.addEventListener('load', function () { fix(); setTimeout(fix, 1500); });
})();
</script>
