    if (!window.supabase) return state('<h1>تعذّر الاتصال</h1><p>تأكد/ي من الاتصال بالإنترنت ثم حدّث/ي الصفحة.</p>');
    const sb = MN.sb();
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return state('<h1>سجّل/ي الدخول أولًا</h1><p>ادخل/ي إلى لوحة الطالب ببريدك، ثم افتح/ي الغرفة من هناك.</p><div class="btns"><a href="student.html">لوحة الطالب</a></div>');
    ADMIN = (session.user.email || '').toLowerCase() === MN.ADMIN_EMAIL;
    if (ADMIN) { await MNMfa.ensure(sb); const fresh = await sb.auth.getSession(); if (fresh.data.session) session.access_token = fresh.data.session.access_token; }
    if (ADMIN) $('backA').href = 'https://maimoonah.com/makeen-admin.html#s-students';
    let r;
    let httpStatus = 0;
    try {
      r = await fetch(MN.SB_URL + '/functions/v1/room-token', { method: 'POST', headers: { apikey: MN.SB_ANON, Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json' }, body: JSON.stringify({ sub: SUB }) }).then(async (x) => { httpStatus = x.status; const t = await x.text(); try { return JSON.parse(t); } catch (e) { return { error: x.status === 404 ? 'not_deployed' : 'server_error' }; } });
      if (r && !r.jwt && !r.error) r = { error: httpStatus === 404 ? 'not_deployed' : 'server_error' };
    } catch (e) { r = { error: 'network' }; }
    const ERR = {
      not_configured: '<h1>الغرف الدراسية قيد التجهيز</h1><p>تُفعَّل قريبًا بإذن الله. وإلى ذلك الحين ادخل/ي الحلقة من رابطها في لوحتك.</p>',
      expired: '<h1>انتهى الاشتراك</h1><p>جدّد/ي اشتراكك من لوحة الطالب ليعود دخول الغرفة.</p>',
      not_yours: '<h1>هذه الغرفة لاشتراك آخر</h1><p>ادخل/ي بالبريد المسجّل في الاشتراك.</p>',
      not_signed_in: '<h1>انتهت جلسة الدخول</h1><p>ادخل/ي من جديد من لوحة الطالب.</p>',
      network: '<h1>تعذّر الاتصال</h1><p>تأكد/ي من الإنترنت ثم أعد/أعيدي المحاولة.</p>',
      not_deployed: '<h1>الغرف الدراسية قيد التجهيز</h1><p>خدمة الغرف لم تُنشر بعد على الخادم.</p>',
      key_error: '<h1>تعذّر فتح الغرفة</h1><p>مفتاح خدمة الغرف غير مقروء. تحتاج الإدارة مراجعة المفتاح الخاص في إعدادات الخادم.</p>',
      server_error: '<h1>تعذّر فتح الغرفة</h1><p>حدث خطأ في الخادم، أعد/أعيدي المحاولة بعد قليل.</p>',
      not_found: '<h1>الاشتراك غير موجود</h1><p>افتح/ي الغرفة من لوحة الطالب.</p>',
      jaas_script: '<h1>تعذّر تحميل الغرفة</h1><p>لم تُحمَّل خدمة الغرف. تأكد/ي من الإنترنت، أو جرّب/ي متصفحًا آخر.</p>'
    };
    if (!r || !r.jwt) return state((ERR[r && r.error] || ERR.network) + (ADMIN ? '<p style="font-size:12.5px;color:#8A7A55" dir="ltr">code: ' + String((r && r.error) || 'network') + ' · ' + httpStatus + ' · ' + String((r && r.fn) || 'v1') + (r && r.detail ? ' · ' + String(r.detail) : '') + '</p>' : '') + '<div class="btns"><a href="student.html">لوحة الطالب</a><button class="alt" onclick="location.reload()">إعادة المحاولة</button></div>');
    if (r.teacher) { $('backA').href = 'teacher-panel.html'; ADMIN = false; window.IS_T = true; }
    $('title').textContent = r.title || 'الغرفة الدراسية'; $('sub').textContent = (MODE === 'audio' ? 'حلقة صوتية' : 'حلقة بالفيديو') + (ADMIN ? ' · أنتِ مشرفة الغرفة' : r.teacher ? ' · أنت/ِ معلم/ة الحلقة' : '');
    await new Promise((ok, bad) => { const s = document.createElement('script'); s.src = 'https://8x8.vc/' + r.appId + '/external_api.js'; s.onload = ok; s.onerror = bad; document.head.appendChild(s); }).catch(() => null);
    if (!window.JitsiMeetExternalAPI) return state(ERR.jaas_script + (ADMIN ? '<p style="font-size:12.5px;color:#8A7A55" dir="ltr">code: jaas_script · ' + String(r.appId || '').slice(0, 24) + '</p>' : '') + '<div class="btns"><button onclick="location.reload()">إعادة المحاولة</button></div>');
    $('meet').innerHTML = '';
    // تشخيص للإدارة فقط: هل بيانات التذكرة بالشكل الذي تطلبه خدمة 8x8؟
    if (ADMIN) { try {
      const dec = (x) => JSON.parse(decodeURIComponent(escape(atob(x.replace(/-/g, '+').replace(/_/g, '/')))));
      const [hd, pl] = r.jwt.split('.').slice(0, 2).map(dec), app = String(r.appId || ''), kid = String(hd.kid || '');
      const ck = (ok, t) => `<li style="color:${ok ? '#166534' : '#B91C1C'}">${ok ? '✓' : '✗'} ${t}</li>`;
      const list = ck(/^vpaas-magic-cookie-[0-9a-f]{20,40}$/.test(app), 'JAAS_APP_ID بالشكل الصحيح (vpaas-magic-cookie- دون مسافات أو أسطر)') +
        ck(kid.startsWith(app + '/') && /^[^\s/]+\/[0-9A-Za-z]{3,40}$/.test(kid), 'JAAS_KID يبدأ بالـ AppID نفسه ثم / ثم معرّف المفتاح') +
        ck(pl.sub === app, 'sub في التذكرة = AppID') + ck(pl.aud === 'jitsi' && pl.iss === 'chat', 'aud و iss صحيحان') +
        ck(pl.exp * 1000 > Date.now() && pl.nbf * 1000 <= Date.now() + 60000, 'وقت التذكرة صالح') + ck(String(r.room).split('/')[1] === pl.room, 'اسم الغرفة مطابق');
      const box = document.createElement('details'); const hh = (document.querySelector('header') || { offsetHeight: 60 }).offsetHeight; box.style.cssText = 'position:fixed;top:' + (hh + 6) + 'px;left:8px;max-width:min(92vw,460px);z-index:50;opacity:.95;background:#fff;border:1.5px solid #C9A04A;border-radius:12px;padding:8px 12px;font:13px/1.8 Cairo,Tahoma,sans-serif;color:#12355B;max-height:45vh;overflow:auto';
      box.innerHTML = '<summary style="cursor:pointer;font-weight:800;font-size:12.5px">🔧 التشخيص</summary><ul style="margin:6px 0;padding-inline-start:18px">' + list + '</ul><div dir="ltr" style="font-size:12px;word-break:break-all">AppID: ' + esc2(app) + '<br>kid: ' + esc2(kid) + '<br>room: ' + esc2(pl.room) + '</div><p style="margin:6px 0 0">إن كانت كل العلامات ✓ والدخول مرفوض، فالمفتاح الخاص المحفوظ في Supabase ليس شريك المفتاح العام المرفوع في JaaS بهذا الـ kid: احذفي المفتاح من JaaS وأنشئي مفتاحًا جديدًا (Add API key ← Generate)، ثم ضعي ملفه الخاص كاملًا ومعرّفه الجديد في الأسرار.</p>';
      document.body.appendChild(box);
    } catch (e) {} }
    API = new JitsiMeetExternalAPI('8x8.vc', {
      roomName: r.room, jwt: r.jwt, parentNode: $('meet'), lang: 'ar',
      configOverwrite: { gravatar: { disabled: true }, disableThirdPartyRequests: true, startWithVideoMuted: MODE === 'audio', startAudioOnly: MODE === 'audio', disableDeepLinking: true, prejoinConfig: { enabled: MODE !== 'audio' }, ...(MODE === 'audio' ? { toolbarButtons: AUDIO_TB, disableSelfView: true, disableTileView: true, startVideoMuted: 0 } : {}), defaultLanguage: 'ar', disableInviteFunctions: true, enableWelcomePage: false, hideConferenceSubject: false, subject: r.title || '' },
      interfaceConfigOverwrite: { SHOW_PROMOTIONAL_CLOSE_PAGE: false, MOBILE_APP_PROMO: false }
    });
    // الحلقة/المكالمة الصوتية: الكاميرا مطفأة دائمًا ولا زرّ لها (حتى لو حفظ المتصفح إعدادًا سابقًا بتشغيلها)
    if (MODE === 'audio') {
      const camOff = () => { try { API.isVideoMuted().then((m) => { if (!m) API.executeCommand('toggleVideo'); }); } catch (e) {} };
      API.addListener('videoConferenceJoined', () => { camOff(); setTimeout(camOff, 1500); });
      API.addListener('videoMuteStatusChanged', (e) => { if (e && e.muted === false) camOff(); });
    }
    // رفض خدمة الغرف للتذكرة: رسالة واضحة، وللإدارة تفاصيل التشخيص
    API.addListener('errorOccurred', (e) => {
      const er = (e && e.error) || {}; const nm = String(er.name || er.message || '');
      if (!/auth|notAllowed|not-allowed|password|token|jwt/i.test(nm + ' ' + (er.type || ''))) return;
      let info = ''; try { const p = JSON.parse(atob(r.jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); const hd = JSON.parse(atob(r.jwt.split('.')[0].replace(/-/g, '+').replace(/_/g, '/'))); info = 'kid: ' + hd.kid + ' · sub: ' + p.sub + ' · room: ' + p.room + ' · mod: ' + (p.context && p.context.user && p.context.user.moderator) + ' · err: ' + nm; } catch (x) {}
      try { API.dispose(); } catch (x) {}
      state('<h1>تعذّر دخول الغرفة</h1><p>رفضت خدمة الغرف تذكرة الدخول. أبلغ/ي الإدارة، أو أعد/أعيدي المحاولة بعد قليل.</p>' + (ADMIN ? '<p style="font-size:12.5px;color:#8A7A55" dir="ltr">' + info.replace(/</g, '&lt;') + '</p><p style="font-size:13px">راجعي في لوحة JaaS أن المفتاح العام (Public key) المرفوع يطابق المفتاح الخاص في أسرار Supabase، وأن JAAS_KID هو معرّف هذا المفتاح نفسه.</p>' : '') + '<div class="btns"><button onclick="location.reload()">إعادة المحاولة</button></div>');
    });
    // الحضور: دخول الطالب الغرفة يسجّل حضوره في حصة اليوم تلقائيًا (ومن لم يدخل تُحسب له غيابًا)
    API.addListener('videoConferenceJoined', async () => {
      if (ADMIN || r.teacher) return;
      try {
        const { data } = await MN.sb().rpc('my_subscriptions'); const x = (data || []).find((s) => s.id === SUB); if (!x || !window.MNClasses) return;
        const now = Date.now(), win = (c) => now >= c.at.getTime() - 60 * 60000 && now <= c.at.getTime() + (MNClasses.CLASS_MIN + 90) * 60000;
        const c = MNClasses.sessions(x, {}).find(win); if (!c) return;
        const k = 'mn_att_' + SUB + '_' + c.day; try { if (localStorage.getItem(k)) return; } catch (e) {}
        const res = await MN.sb().rpc('mark_room_attendance', { p_sub: SUB, p_day: c.day });
        if (!res.error && res.data === 'ok') { try { localStorage.setItem(k, '1'); } catch (e) {} }
      } catch (e) {}
    });
    // المعلم/ة داخل الغرفة: يُعلَن ذلك لطلابه الآخرين («في حلقة أخرى الآن»)
    if (r.teacher || ADMIN) (async () => { try { const { data } = await MN.sb().rpc('teacher_dashboard'); const tid = data && data.teacher && data.teacher.id; if (!tid) return; const ch = MN.sb().channel('mkteacher-' + tid); ch.subscribe((st) => { if (st === 'SUBSCRIBED') ch.track({ sub: SUB, at: Date.now() }); }); } catch (e) {} })();
    API.addListener('readyToClose', () => { location.href = ADMIN ? 'https://maimoonah.com/makeen-admin.html#s-students' : r.teacher ? 'teacher-panel.html' : 'student.html'; });
    $('btnQ').hidden = false;
  }
  $('btnQ').onclick = () => {
    const s = $('side'), on = s.hidden;
    if (on && !s.firstChild) { const f = document.createElement('iframe'); f.title = 'المصحف'; f.src = 'https://maimoonah.com/mushaf.html?sub=' + encodeURIComponent(SUB) + (ADMIN || window.IS_T ? '&lesson' : ''); s.appendChild(f); }
    s.hidden = !on; $('btnQ').classList.toggle('on', on);
  };
  // الموافقة الصريحة قبل أول دخول للغرفة (الطالب والمعلم)
  const CONSENT_KEY = 'mn_room_consent_v1';
  function hasConsent() { try { return localStorage.getItem(CONSENT_KEY) === '1'; } catch (e) { return false; } }
  if (hasConsent()) start();
  else {
    state(`<h1>قبل دخول الغرفة الدراسية</h1>
      <p style="text-align:right">تُعقد الحلقة عبر خدمة غرف خارجية موثوقة، وقد تُسجَّل الحصة وتُفرَّغ وتُحلَّل آليًا لمراقبة جودة العملية التعليمية، وحفظ حق الطالب/ة والمعلم/ة، ومنع تبادل وسائل التواصل الشخصية. ولا يطّلع عليها إلا الطالب/ة وإدارة مكين، وتُحذف بعد مدة محددة. التفاصيل في <a href="privacy.html" target="_blank" rel="noopener">سياسة الخصوصية</a>.</p>
      <label style="display:flex;gap:10px;align-items:flex-start;text-align:right;background:#F0FDF4;border:1.5px solid #10B981;border-radius:10px;padding:10px;font-weight:700;color:#12355B;cursor:pointer"><input type="checkbox" id="rcOk" style="width:22px;height:22px;flex:0 0 auto;margin-top:3px;accent-color:#10B981">قرأتُ ذلك وأوافق على دخول الغرفة وفق سياسة الخصوصية.</label>
      <div class="btns" style="margin-top:12px"><button id="rcGo" disabled>دخول الغرفة</button><a class="alt" href="student.html">رجوع</a></div>`);
    $('rcOk').onchange = () => { $('rcGo').disabled = !$('rcOk').checked; };
    $('rcGo').onclick = () => { try { localStorage.setItem(CONSENT_KEY, '1'); } catch (e) {} $('meet').innerHTML = '<div class="box" style="margin-top:12vh"><span class="spin"></span><p style="margin-top:10px">جارٍ تجهيز الغرفة…</p></div>'; start(); };
  }
</script>

<script id="mkGold">/* توحيد ذهبي الشريط العلوي مع ذهبي القائمة الجانبية (#C9A45C) في كل صفحات مكين */
(function () {
  var BRIGHT = /243, 211, 122|229, 193, 88/, G = '#C9A45C', G2 = '#B8935A';
  function fix() {
    document.querySelectorAll('header, header *, .mk-top, .mk-top *').forEach(function (e) {
      var c = getComputedStyle(e);
      if (BRIGHT.test(c.color)) e.style.setProperty('color', G, 'important');
      if (BRIGHT.test(c.backgroundColor)) e.style.setProperty('background-color', G, 'important');
      if (BRIGHT.test(c.backgroundImage)) e.style.setProperty('background-image', 'linear-gradient(90deg,' + G + ',' + G2 + ')', 'important');
      ['Top', 'Right', 'Bottom', 'Left'].forEach(function (s) {
        if (BRIGHT.test(c['border' + s + 'Color'])) e.style.setProperty('border-' + s.toLowerCase() + '-color', G, 'important');
      });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fix); else fix();
  window.addEventListener('load', function () { fix(); setTimeout(fix, 1500); });
})();
</script>
