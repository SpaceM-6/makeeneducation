<title>المتابعة البحثية | شركة مكين</title>
<meta property="og:type" content="website"><meta property="og:site_name" content="شركة مكين"><meta property="og:locale" content="ar_AR"><meta property="og:title" content="المتابعة البحثية | شركة مكين"><meta property="og:description" content="شركة مكين للاستشارات والتدريب والتعليم: برامج القرآن الكريم وعلومه والعلوم الشرعية واللغة العربية عن بُعد."><meta property="og:image" content="https://spacem-6.github.io/makeeneducation/icons/icon-512.png"><meta property="og:image:width" content="512"><meta property="og:image:height" content="512"><meta name="twitter:card" content="summary">
<link rel="icon" href="favicon.ico" sizes="48x48"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MakeenEducation"><script src="pwa.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy:#12355B; --gold:#F3D37A; --ink:#1F2937; --brown:#4B5563; --line:#E2E8F0; }
  * { box-sizing:border-box; } [hidden] { display:none !important; }
  html, body { overflow-x:clip; max-width:100%; height:100%; }
  body { margin:0; background:#F8F9FA url('assets/marble.jpg') 0 0/1400px auto repeat; color:var(--ink); font-family:Cairo, Tahoma, sans-serif; line-height:1.8; display:flex; flex-direction:column; }
  header { background:var(--navy); border-bottom:3px solid var(--gold); padding:8px 12px; display:flex; align-items:center; gap:10px; flex:0 0 auto; }
  header a.back { color:var(--gold); text-decoration:none; font-weight:800; font-size:20px; }
  header .t { flex:1; min-width:0; } header .t b { display:block; color:var(--gold); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } header .t small { color:#E2E8F0; font-size:12.5px; }
  header a.call { background:var(--gold); color:var(--navy); border-radius:999px; padding:6px 12px; font-weight:800; text-decoration:none; font-size:14px; white-space:nowrap; }
  main { flex:1; min-height:0; display:flex; flex-direction:column; max-width:860px; width:100%; margin:0 auto; padding:10px 12px 0; }
  .card { background:rgba(255,255,255,.97); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px; }
  details summary { cursor:pointer; font-weight:800; color:var(--navy); }
  .items { display:grid; gap:6px; margin-top:8px; }
  .item { display:flex; justify-content:space-between; align-items:center; gap:8px; background:#F8FAFC; border:1px solid #E2E8F0; border-radius:10px; padding:6px 10px; font-weight:700; font-size:14px; }
  .st { border-radius:999px; padding:0 10px; font-size:12.5px; font-weight:800; white-space:nowrap; }
  .st-todo { background:#F1F5F9; color:#475569; } .st-doing { background:#FEF3C7; color:#92400E; } .st-delivered { background:#DBEAFE; color:#1E40AF; } .st-approved { background:#DCFCE7; color:#166534; }
  .item select { font:inherit; font-size:13px; border:1px solid #CBD5E1; border-radius:8px; padding:2px 6px; }
  .chat { flex:1; min-height:200px; overflow-y:auto; background:rgba(255,255,255,.85); border:1px solid var(--line); border-radius:14px; padding:10px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:82%; border-radius:14px; padding:7px 11px; font-size:15px; white-space:pre-wrap; word-wrap:break-word; }
  .msg small { display:block; font-size:11.5px; opacity:.75; }
  .msg.me { align-self:flex-start; background:var(--navy); color:#fff; border-bottom-right-radius:4px; }
  .msg.them { align-self:flex-end; background:#fff; border:1px solid #E2E8F0; border-bottom-left-radius:4px; }
  .msg.admin { align-self:center; background:#FFFBEB; border:1px solid var(--gold); max-width:92%; }
  .file { display:flex; align-items:center; gap:8px; margin-top:4px; background:rgba(243,211,122,.18); border-radius:10px; padding:5px 8px; }
  .file button { font:inherit; font-size:13px; font-weight:800; border:0; border-radius:8px; padding:3px 10px; background:var(--gold); color:var(--navy); cursor:pointer; }
  .compose { display:flex; gap:6px; align-items:flex-end; padding:8px 0 12px; flex:0 0 auto; }
  .compose textarea { flex:1; min-height:44px; max-height:140px; resize:vertical; border:1px solid #CBD5E1; border-radius:12px; padding:9px 11px; font:inherit; }
  .compose button, .compose label.att { flex:0 0 auto; height:44px; min-width:44px; border:0; border-radius:12px; font:800 15px Cairo, sans-serif; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; padding:0 12px; }
  .compose .send { background:var(--navy); color:var(--gold); } .compose label.att { background:#fff; border:1.5px solid var(--navy); color:var(--navy); }
  .pending { font-size:13px; color:var(--brown); margin:0 0 4px; }
  .empty { text-align:center; color:var(--brown); margin:auto; }
</style>
<script src="https://maimoonah.com/js/classes.js"></script>
</head>
<body data-app-bar>
<header><a class="back" id="back" href="student.html" aria-label="رجوع">→</a><div class="t"><b id="hTitle">المتابعة البحثية</b><small id="hSub"></small></div><a class="call" id="call" hidden href="#">📞 اتصال صوتي</a></header>
<main>
  <div id="box"><div class="card">جارٍ التحميل…</div></div>
  <div class="chat" id="chat" hidden></div>
  <p class="pending" id="upMsg" hidden></p>
  <div class="compose" id="compose" hidden>
    <label class="att" title="إرفاق ملف"><input type="file" id="file" hidden>📎</label>
    <textarea id="txt" placeholder="اكتب/ي رسالتك…" rows="1"></textarea>
    <button class="send" id="send">إرسال</button>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://maimoonah.com/js/sb.js"></script>
<script src="https://maimoonah.com/js/mfa.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  if (!window.supabase) { $('box').innerHTML = '<div class="card">تعذّر الاتصال بالخادم. تأكد/ي من الإنترنت ثم حدّث/ي الصفحة.</div>'; throw new Error('no supabase'); }
  const sb = MN.sb();
  const SUB = new URLSearchParams(location.search).get('sub') || '';
  const ST = { todo: 'لم يبدأ', doing: 'قيد العمل', delivered: 'سُلّم', approved: 'اعتُمد' };
  const MAXB = 25 * 1024 * 1024;
  let ROLE = '', LAST = 0, D = null;
  const size = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + ' ميجا' : Math.max(1, Math.round(n / 1024)) + ' ك.ب';
  const when = (t) => new Date(t).toLocaleString('ar-EG-u-nu-latn', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
  function head() {
    const s = D.sub;
    $('hTitle').textContent = s.title ? 'بحث: ' + s.title : s.program;
    $('hSub').textContent = ROLE === 'researcher' ? 'طالب الخدمة: ' + (s.student || '') : 'الباحث/ة المتابع/ة: ' + (s.researcher || 'يُحدَّد قريبًا');
    $('back').href = ROLE === 'researcher' ? 'teacher-panel.html' : ROLE === 'admin' ? 'https://maimoonah.com/makeen-admin.html#s-students' : 'student.html';
    const canCall = s.status === 'active' && (ROLE !== 'student' || s.researcher);
    $('call').hidden = !canCall; $('call').href = 'room.html?sub=' + encodeURIComponent(SUB) + '&mode=audio';
    const items = String(s.items || '').split('،').map((x) => x.trim()).filter(Boolean), pr = s.progress || {};
    const edit = ROLE === 'researcher' || ROLE === 'admin';
    $('box').innerHTML = `<details class="card" ${window.innerWidth > 700 ? 'open' : ''}><summary>مراحل العمل (${items.filter((i) => pr[i] === 'approved').length} من ${items.length} معتمد)</summary>
      <div class="items">${items.map((i) => { const v = pr[i] || 'todo'; return `<div class="item"><span>${esc(i)}</span>${edit ? `<select data-item="${esc(i)}">${Object.keys(ST).map((k) => `<option value="${k}" ${k === v ? 'selected' : ''}>${ST[k]}</option>`).join('')}</select>` : `<span class="st st-${v}">${ST[v]}</span>`}</div>`; }).join('') || '<p class="pending">لم تُحدَّد بنود.</p>'}</div>
      ${s.notes ? `<p class="pending" style="margin-top:8px">تفاصيل الطلب: ${esc(s.notes)}</p>` : ''}
      <p class="pending" style="margin-top:6px">يُمنع تبادل أرقام الهواتف أو الحسابات الشخصية؛ وكل التواصل والملفات هنا. وتطّلع إدارة مكين على المحادثة.</p></details>`;
    document.querySelectorAll('[data-item]').forEach((sel) => sel.onchange = async () => {
      sel.disabled = true; const { error } = await sb.rpc('rs_set_item', { p_sub: SUB, p_item: sel.dataset.item, p_status: sel.value }); sel.disabled = false;
      if (error) alert('تعذّر الحفظ.');
    });
  }
  function msgHtml(m) {
    const mine = m.sender === ROLE, cls = m.sender === 'admin' && !mine ? 'admin' : mine ? 'me' : 'them';
    return `<div class="msg ${cls}"><small>${esc(m.name || '')} · ${when(m.at)}</small>${m.body ? esc(m.body) : ''}${m.file_path ? `<div class="file">📎 <span>${esc(m.file_name || 'ملف')} <small style="display:inline">(${size(m.file_size || 0)})</small></span><button data-file="${esc(m.file_path)}">فتح</button></div>` : ''}</div>`;
  }
  function addMsgs(list) {
    if (!list.length) { if (!LAST) $('chat').innerHTML = '<p class="empty">ابدأ/ي المحادثة هنا: اكتب/ي ما تحتاجه، وأرفق/ي ملفاتك.</p>'; return; }
    if (!LAST) $('chat').innerHTML = '';
    const near = $('chat').scrollHeight - $('chat').scrollTop - $('chat').clientHeight < 120;
    $('chat').insertAdjacentHTML('beforeend', list.map(msgHtml).join(''));
    LAST = list[list.length - 1].id;
    if (near || list.some((m) => m.sender === ROLE)) $('chat').scrollTop = $('chat').scrollHeight;
  }
  async function poll() {
    const { data } = await sb.rpc('rs_thread', { p_sub: SUB, p_after: LAST });
    if (data && Array.isArray(data.messages) && data.messages.length) { addMsgs(data.messages); }
  }
  async function send(body, file) {
    $('send').disabled = true;
    let fp = null, fn = null, fs = null;
    try {
      if (file) {
        if (file.size > MAXB) throw new Error('الملف أكبر من ٢٥ ميجا.');
        $('upMsg').hidden = false; $('upMsg').textContent = 'جارٍ رفع ' + file.name + '…';
        fp = SUB + '/' + Date.now() + '-' + file.name.replace(/[^\w.\-]+/g, '_').slice(-80);
        const up = await sb.storage.from('rs-files').upload(fp, file, { contentType: file.type || 'application/octet-stream', upsert: false });
        if (up.error) throw up.error; fn = file.name; fs = file.size;
      }
      const { error } = await sb.rpc('rs_send', { p_sub: SUB, p_body: body || null, p_file_path: fp, p_file_name: fn, p_file_size: fs });
      if (error) throw error;
      $('txt').value = ''; $('upMsg').hidden = true; await poll();
    } catch (e) { $('upMsg').hidden = false; $('upMsg').textContent = 'تعذّر الإرسال: ' + (e.message || e); }
    $('send').disabled = false;
  }
  $('send').onclick = () => { const t = $('txt').value.trim(); if (t) send(t, null); };
  $('txt').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('send').click(); });
  $('file').onchange = () => { const f = $('file').files[0]; $('file').value = ''; if (f) send($('txt').value.trim(), f); };
  $('chat').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-file]'); if (!b) return;
    b.disabled = true; const { data, error } = await sb.storage.from('rs-files').createSignedUrl(b.dataset.file, 600); b.disabled = false;
    if (error || !data) return alert('تعذّر فتح الملف.');
    window.open(data.signedUrl, '_blank', 'noopener');
  });
  async function boot() {
    if (!/^[0-9a-f-]{36}$/i.test(SUB)) { $('box').innerHTML = '<div class="card">افتح/ي المتابعة من لوحتك.</div>'; return; }
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { $('box').innerHTML = '<div class="card"><b>سجّل/ي الدخول أولًا</b><p>ادخل/ي إلى لوحة الطالب (أو لوحة المعلم) ببريدك، ثم افتح/ي المتابعة البحثية من هناك.</p><a href="student.html">لوحة الطالب</a> · <a href="teacher-panel.html">لوحة المعلم</a></div>'; return; }
    if ((session.user.email || '').toLowerCase() === MN.ADMIN_EMAIL && window.MNMfa) { try { await MNMfa.ensure(sb); } catch (e) {} }
    const { data, error } = await sb.rpc('rs_thread', { p_sub: SUB, p_after: 0 });
    if (error || !data || data.error) { $('box').innerHTML = '<div class="card">هذه المتابعة لا تخص حسابك، أو لم تُفعَّل بعد.</div>'; return; }
    D = data; ROLE = data.role; head();
    $('chat').hidden = false; $('compose').hidden = false; addMsgs(data.messages || []);
    setInterval(poll, 8000);
  }
  boot();
</script>
</body>
</html>
