<style>
.ck-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 18px}
.ck-tab{font:inherit;cursor:pointer;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 6px;color:var(--navy);display:flex;flex-direction:column;align-items:center;gap:2px}
.ck-tab b{font-size:16px}.ck-tab small{color:var(--muted);font-size:12.5px;line-height:1.5;text-align:center}
.ck-tab.on{background:var(--navy);border-color:var(--navy);color:var(--gold)}.ck-tab.on small{color:#E2E8F0}
.ck-grp{color:#8E5A12;font-size:17px;margin:18px 0 8px}
.ck-card{text-align:right;align-items:stretch}.ck-card h3{font-size:18px;margin:0 0 4px}.ck-card p{color:var(--muted);margin:0 0 8px;font-size:14.5px;line-height:1.8;flex:1}
.ck-meta{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}.ck-meta span{background:#FFF8E6;border:1px solid #E8D29A;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:700;color:#7A4E0E}
.ck-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.ck-ver{font-size:13px;font-weight:800;color:var(--navy)}
.ck-new{background:#DC2626;color:#fff;border-radius:999px;padding:0 8px;font-size:12px;font-weight:900;margin-inline-start:6px;vertical-align:middle}
.ck-ij{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.ck-ij img{width:150px;border-radius:10px;border:2px solid #D4B466;box-shadow:0 8px 20px rgba(10,30,60,.25);cursor:zoom-in}
.ck-ij div{flex:1;min-width:220px}
.ck-modal{position:fixed;inset:0;z-index:4000;background:rgba(18,53,91,.6);display:none;align-items:flex-start;justify-content:center;padding:20px 12px;overflow-y:auto}.ck-modal.open{display:flex}
.ck-box{background:#fff;border-radius:18px;max-width:520px;width:100%;padding:18px;position:relative}
.ck-box h3{color:var(--navy);margin:6px 0 12px;font-size:18px;text-align:center}
.ck-box label{display:block;font-weight:700;margin:8px 0 3px;color:var(--navy);font-size:14px}
.ck-box input,.ck-box select,.ck-box textarea{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.ck-x{position:absolute;top:10px;left:12px;border:0;background:none;font:800 14px Cairo,sans-serif;color:var(--navy);cursor:pointer}
.ck-msg{margin-top:10px;font-weight:700;text-align:center}
.ck-zoom{position:fixed;inset:0;z-index:5000;background:rgba(8,18,35,.88);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}.ck-zoom img{max-width:100%;max-height:100%;border-radius:10px}
@media (max-width:560px){.ck-tabs{gap:6px}.ck-tab b{font-size:14px}.ck-tab small{font-size:11px}}
</style>

<main class="mk-wrap">
  <h1 class="mk-h1">الدورات والاستشارات والإجازات</h1>
  <p class="mk-sub">دورات بشهادات موثّقة، واستشارات متخصصة، وإجازات قرآنية بأسانيد معلمي ومعلمات مكين المجيزين</p>
  <div class="ck-tabs" role="tablist">
    <button type="button" class="ck-tab" data-t="courses" onclick="ckTab('courses')"><b>🎓 دورات بشهادة موثّقة</b><small>شهادة مختومة عليها رمز تحقق QR</small></button>
    <button type="button" class="ck-tab" data-t="consult" onclick="ckTab('consult')"><b>💼 الدورات الاستشارية</b><small>جلسات فردية ٣٠–٦٠ دقيقة</small></button>
    <button type="button" class="ck-tab" data-t="ijazat" onclick="ckTab('ijazat')"><b>📜 الإجازات القرآنية</b><small>بأسانيد المعلمين المجيزين</small></button>

  <section id="ck-consult" hidden></section>
  <section id="ck-ijazat" hidden></section>

</main>
<div class="ck-modal" id="ckModal" role="dialog" aria-modal="true"><div class="ck-box">
  <button type="button" class="ck-x" onclick="ckClose()">✕ إغلاق</button>
  <h3 id="ckTitle"></h3>
  <form id="ckForm" onsubmit="ckSubmit(event)">
    <div id="ckModeG"><label>طريقة الدراسة</label><select id="ck_mode" onchange="ckPrice()"><option value="live">حلقات مباشرة على Google Meet</option><option value="recorded">دروس مسجلة</option></select></div>
    <div id="ckConsG" hidden>
      <label for="ck_dur">مدة الجلسة</label><select id="ck_dur" onchange="ckPrice()"><option value="30">٣٠ دقيقة</option><option value="45">٤٥ دقيقة</option><option value="60">٦٠ دقيقة</option></select>
      <label for="ck_who">المستشار/ة</label><select id="ck_who"><option value="">أي مستشار/ة متاح/ة في هذا المجال</option></select>
      <label for="ck_when">المواعيد المناسبة لك</label><input id="ck_when" placeholder="مثال: السبت أو الأحد بعد العصر بتوقيت مكة">
      <label for="ck_topic">موضوع الاستشارة باختصار</label><textarea id="ck_topic" rows="3" maxlength="800"></textarea>
    </div>
    <label for="ck_name">الاسم بالكامل</label><input id="ck_name" required autocomplete="name">
    <label for="ck_gender">الجنس</label><select id="ck_gender"><option value="f">أنثى</option><option value="m">ذكر</option></select>
    <label for="ck_phone">رقم الواتساب</label><input id="ck_phone" type="tel" dir="ltr" required placeholder="00966XXXXXXX">
    <label for="ck_email">البريد الإلكتروني</label><input id="ck_email" type="email" dir="ltr" required placeholder="name@example.com">
    <label for="ck_region">منطقة الإقامة</label><select id="ck_region" required onchange="ckPrice()"><option value="">— اختر/ي —</option><option value="gulf">دول الخليج</option><option value="egypt">مصر</option><option value="europe">أوروبا</option><option value="usa">أمريكا</option><option value="canada">كندا</option><option value="world">بقية العالم</option></select>
    <label for="ck_country">الدولة</label><input id="ck_country" required placeholder="مثال: السعودية">
    <div id="ckPrice" style="display:none;margin-top:10px;background:#FFF8E6;border:1.5px solid #E8D29A;border-radius:12px;padding:8px 12px;font-weight:800;color:var(--navy);text-align:center"></div>
    <label for="ck_notes">ملاحظات (اختياري)</label><input id="ck_notes">
    <button type="submit" class="mk-btn" id="ckBtn" style="width:100%;margin-top:14px">إرسال الطلب</button>
    <p class="ck-msg" id="ckMsg" hidden></p>
  </form>
</div></div>

<script>
(function () {
  var E = MK.esc, CAT = MKCAT.load(), cur = null, TEACH = [], PRICES = {};
  var AR = function (n) { return String(n).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; }); };
  var NEW_UNTIL = Date.parse('2026-12-15');
  function card(x, kind) {
    return '<article class="mk-card ck-card" id="c-' + E(x.key) + '"><h3>' + E(x.t) + (Date.now() < NEW_UNTIL && x.isNew !== false ? '<span class="ck-new">جديد</span>' : '') + '</h3>' +
      (x.meta && x.meta.length ? '<div class="ck-meta">' + x.meta.map(function (m) { return '<span>' + E(m) + '</span>'; }).join('') + '</div>' : '') +
      '<p>' + E(x.d) + '</p><div class="ck-acts"><button type="button" class="mk-btn" data-reg="' + E(x.key) + '" data-kind="' + kind + '">' + (kind === 'consult' ? 'احجز/ي استشارة' : 'سجّل/ي الآن') + '</button>' +
      (kind === 'consult' ? '' : '<a class="ck-ver" href="https://maimoonah.com/cert.html">📷 تحقق من شهادة</a>') + '</div></article>';
  }
  function groups(list, kind, G) {
    var out = ''; Object.keys(G).forEach(function (g) { var l = list.filter(function (x) { return x.grp === g && x.on !== false; });
      if (l.length) out += '<h2 class="ck-grp">' + E(G[g]) + '</h2><div class="mk-grid">' + l.map(function (x) { return card(x, kind); }).join('') + '</div>'; });
    return out || '<p class="mk-msg">تُضاف قريبًا بإذن الله.</p>';
  }
  function draw() {
    document.getElementById('ck-courses').innerHTML = '<div class="mk-box"><p style="margin:0">دورات يقدّمها معلمو ومعلمات مكين، تُختم في آخرها بشهادة إتمام موثّقة من شركة مكين، عليها رقم تسجيل ورمز QR يتحقق به أي أحد من صحتها، وتصل إلى حسابك لتحمّلها/يها PDF.</p></div>' + groups(CAT.courses, 'course', MKCAT.COURSE_GROUPS);
    document.getElementById('ck-consult').innerHTML = '<div class="mk-box"><p style="margin:0">جلسات استشارية فردية مع مستشارين متخصصين، مدتها من ٣٠ إلى ٦٠ دقيقة على Google Meet، ويختلف سعرها بحسب نوع الاستشارة ومدتها. اختر/ي المجال، وأرسل/ي طلبك، فنتواصل معك لتأكيد الموعد مع المستشار/ة وطريقة الدفع.</p></div>' + groups(CAT.consult, 'consult', MKCAT.CONSULT_GROUPS);
    drawIjazat();
  }
  function drawIjazat() {
    var M = 'https://maimoonah.com/';
    var mine = '<div class="mk-box ck-ij"><img src="' + M + 'img/ij-cover-sughra.jpg" alt="غلاف الإجازة في القراءات العشر" onclick="ckZoom(this.src)"><div><h2 style="margin:0 0 6px;color:var(--navy)">إجازات المقرئة الشيخة ميمونة عبدالعزيز ندا</h2>' +
      '<p style="margin:0 0 10px">المشرفة التعليمية لقسم الفتيات في مكين، مجازة بالقراءات العشر الصغرى والكبرى بالسند المتصل. تُجيز في القراءات العشر كاملة، أو قراءة إمام بروايتيه، أو رواية واحدة، من الصغرى أو الكبرى، بإجازة مكتوبة مختومة عليها رمز تحقق QR.</p>' +
      '<a class="mk-btn" href="' + M + '#ijazat">تصفّح/ي إجازاتها وسجّل/ي</a></div></div>';
    var list = TEACH.filter(function (t) { return t.ijazat && String(t.ijazat).trim() && !/^ميمونة/.test(t.first_name || ''); });
    var others = '<h2 class="ck-grp">المعلمون والمعلمات المجيزون في مكين</h2>' + (list.length ? '<div class="mk-grid">' + list.map(function (t) {
      return '<article class="mk-card">' + MK.avatar(t, 90) + '<h3>' + E(MK.title(t)) + '</h3>' + (t.headline ? '<p class="mk-head">' + E(t.headline) + '</p>' : '') +
        '<p style="font-size:14px;color:var(--muted);white-space:pre-line;text-align:right;margin:6px 0">' + E(String(t.ijazat).slice(0, 260)) + (String(t.ijazat).length > 260 ? '…' : '') + '</p>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><a class="mk-btn" href="teacher.html?id=' + encodeURIComponent(t.id) + '#ijazat">الإجازات والسند</a><button type="button" class="mk-btn ghost" data-reg="mk-ij-' + E(t.id).slice(0, 30) + '" data-kind="ijaza" data-who="' + E(MK.title(t)) + '">اطلب/ي الإجازة</button></div></article>';
    }).join('') + '</div>' : '<p class="mk-msg">ينضم المعلمون والمعلمات المجيزون إلى مكين قريبًا بإذن الله، وتظهر هنا إجازاتهم بأسانيدهم.</p>');
    document.getElementById('ck-ijazat').innerHTML = mine + others;
  }
  window.ckTab = function (t, keep) {
    ['courses', 'consult', 'ijazat'].forEach(function (k) { document.getElementById('ck-' + k).hidden = k !== t; });
    document.querySelectorAll('.ck-tab').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-t') === t); });
    if (!keep) try { history.replaceState(null, '', '#' + t); } catch (e) {}
  };
  window.ckZoom = function (src) { var o = document.createElement('div'); o.className = 'ck-zoom'; o.innerHTML = '<img alt="">'; o.querySelector('img').src = src; o.onclick = function () { o.remove(); }; document.body.appendChild(o); };
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-reg]'); if (!b) return;
    var kind = b.getAttribute('data-kind'), key = b.getAttribute('data-reg');
    var x = kind === 'ijaza' ? { key: key, t: 'إجازة قرآنية مع ' + b.getAttribute('data-who') } : (kind === 'consult' ? CAT.consult : CAT.courses).filter(function (c) { return c.key === key; })[0];
    if (!x) return; cur = { x: x, kind: kind };
    document.getElementById('ckTitle').textContent = (kind === 'consult' ? 'حجز استشارة: ' : 'التسجيل في: ') + x.t;
    document.getElementById('ckModeG').hidden = kind === 'consult'; document.getElementById('ckConsG').hidden = kind !== 'consult';
    var who = document.getElementById('ck_who'); who.innerHTML = '<option value="">أي مستشار/ة متاح/ة في هذا المجال</option>' + TEACH.filter(function (t) { return (t.programs || []).some(function (p) { return /استشار/.test(p); }); }).map(function (t) { return '<option>' + E(MK.title(t)) + '</option>'; }).join('');
    document.getElementById('ckMsg').hidden = true; document.getElementById('ckBtn').disabled = false;
    ckPrice(); document.getElementById('ckModal').classList.add('open');
  });
  window.ckPrice = function () {
    var box = document.getElementById('ckPrice'), rg = document.getElementById('ck_region').value;
    if (!cur || !rg || cur.kind === 'ijaza') { box.style.display = 'none'; return; }
    var r = (PRICES[cur.x.key] || {})[rg] || {}, f = cur.kind === 'consult' ? 'd' + document.getElementById('ck_dur').value : document.getElementById('ck_mode').value;
    box.textContent = r[f] != null ? (cur.kind === 'consult' ? 'سعر الجلسة: ' : 'الرسوم: ') + AR(Number(r[f]).toLocaleString('en-US')) + ' ' + (r.currency || '') : 'نرسل لك السعر عند التواصل معك';
    box.style.display = 'block';
  };
  window.ckClose = function () { document.getElementById('ckModal').classList.remove('open'); };
  document.getElementById('ckModal').addEventListener('click', function (e) { if (e.target === this) ckClose(); });
  window.ckSubmit = function (e) {
    e.preventDefault();
    var v = function (id) { return document.getElementById(id).value.trim(); }, m = document.getElementById('ckMsg');
    var show = function (t, ok) { m.textContent = t; m.style.color = ok ? '#166534' : '#991B1B'; m.hidden = false; };
    if (v('ck_name').length < 2 || !/^\S+@\S+\.\S+$/.test(v('ck_email')) || v('ck_phone').replace(/\D/g, '').length < 6 || !v('ck_country') || !v('ck_region')) return show('اكتب/ي الاسم والبريد ورقم الواتساب ومنطقة الإقامة والدولة.');
    var notes = [];
    var pb = document.getElementById('ckPrice'); if (pb.style.display === 'block' && /[0-9٠-٩]/.test(pb.textContent)) notes.push(pb.textContent);
    if (cur.kind === 'consult') { notes.push('استشارة ' + v('ck_dur') + ' دقيقة'); if (v('ck_who')) notes.push('المستشار/ة: ' + v('ck_who')); if (v('ck_when')) notes.push('المواعيد: ' + v('ck_when')); if (v('ck_topic')) notes.push('الموضوع: ' + v('ck_topic')); }
    if (cur.kind === 'ijaza') notes.push(cur.x.t);
    if (v('ck_notes')) notes.push(v('ck_notes'));
    document.getElementById('ckBtn').disabled = true;
    var key = (cur.kind === 'ijaza' ? 'mk-ijaza' : cur.x.key).slice(0, 40);
    MK.rpc('course_request', { p: { course: key, mode: cur.kind === 'consult' ? 'live' : v('ck_mode'), name: v('ck_name'), gender: v('ck_gender'), phone: v('ck_phone'), email: v('ck_email'), country: v('ck_country'), notes: ('[مكين] ' + notes.join(' · ')).slice(0, 1000) } })
      .then(function () { document.getElementById('ckForm').reset(); show('✓ وصل طلبك، وسنتواصل معك قريبًا بإذن الله على الواتساب لتأكيد الموعد وطريقة الدفع.', true); })
      .catch(function () { document.getElementById('ckBtn').disabled = false; show('تعذّر الإرسال الآن، حاول/ي مرة أخرى أو راسلنا على الواتساب +201013356935.'); });
  };
  MK.get('site_settings?select=value&key=eq.mk_prices').then(function (r) { PRICES = (r && r[0] && r[0].value) || {}; }).catch(function () {});
  MKCAT.remote().then(function (c) { if (c) { CAT = c; draw(); } });
  MK.get('mk_teachers?select=id,first_name,gender,photo_url,headline,programs,ijazat,is_head&published=eq.true&order=is_head.desc,sort.asc').then(function (r) { TEACH = r || []; drawIjazat(); }).catch(function () {});
  draw();
  var h = (location.hash || '').slice(1); ckTab(['courses', 'consult', 'ijazat'].indexOf(h) >= 0 ? h : 'courses', true);
})();
</script>
