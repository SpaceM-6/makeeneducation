<script src="https://maimoonah.com/js/vendor/supabase-2.45.4.js"></script>

<script>window.MN_CFG={site:"makeen",base:"https://maimoonah.com",app:"تطبيق MakeenEducation",icon:"assets/makeen-logo.jpeg",badge:"assets/makeen-logo.jpeg",today:"today.html",my:"my.html",logo:"#mk-no-header-flag"};</script>
<script src="https://maimoonah.com/js/app.js?v=2026112210"></script>
<script src="https://maimoonah.com/js/sb.js?v=c7"></script>
<script src="https://maimoonah.com/js/pwlogin.js?v=8"></script>
<script src="https://maimoonah.com/js/call.js?v=3"></script>
<script src="https://maimoonah.com/js/avail.js?v=1"></script>
<script src="https://maimoonah.com/js/instapay.js?v=9"></script>
<script src="https://maimoonah.com/js/tlessons.js?v=15"></script>
<script src="https://maimoonah.com/js/attcal.js?v=2"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  if (!window.supabase) { document.querySelector('main').innerHTML = '<div class="card">تعذّر الاتصال بالخادم. تأكد/ي من الإنترنت ثم حدّث/ي الصفحة.</div>'; throw new Error('no supabase'); }
  const sb = MN.sb();
  const C = window.MNClasses;
  const TZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Africa/Cairo'; } catch (e) { return 'Africa/Cairo'; } })();
  const DAYS = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  const MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
  const arDate = (d) => { if (!d) return '—'; const [y, m, day] = String(d).slice(0, 10).split('-').map(Number); return `${day} ${MONTHS[m - 1]} ${y}م`; };
  const hour12 = (h) => { const p = h < 12 ? 'ص' : 'م'; return (h % 12 || 12) + ' ' + p; };
  const PER = { monthly: 'شهري', yearly: 'سنوي' };
  const ST = { active: ['b-active', 'فعّال'], pending: ['b-pending', 'بانتظار التفعيل'], expired: ['b-expired', 'منتهٍ'] };
  const MARK = { done: 'حضر', absent: 'غياب', cancelled: 'أُلغيت', upcoming: 'قادمة' };
  let D = null;

  // الوقت في منطقة المعلم/ة
  const inTz = (date, tz) => { const p = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', weekday: 'short', hour: 'numeric', minute: '2-digit' }).formatToParts(date); const g = (t) => (p.find((x) => x.type === t) || {}).value; return { dow: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(g('weekday')), h: Number(g('hour')) % 24 }; };
  function slotsHtml(s, av) {
    if (!Array.isArray(s.slots) || !s.slots.length) return '<span class="muted">لم يحدد مواعيد بعد</span>';
    const today = new Date().toISOString().slice(0, 10), ref = C.addDays(today, -C.dow(today));
    const atz = (av && av.tz) || TZ;
    return s.slots.slice().sort((a, b) => ((a.dow + 1) % 7) - ((b.dow + 1) % 7)).map((x) => {
      const at = C.zoned(C.addDays(ref, x.dow), x.time, s.slots_tz || 'Africa/Cairo');
      const mine = inTz(at, TZ), t = inTz(at, atz);
      const ok = av && Array.isArray(av.days) && Array.isArray(av.hours) ? av.days.includes(t.dow) && av.hours.includes(t.h) : null;
      return `<span class="slot ${ok === false ? 'no' : 'ok'}" title="${ok === false ? 'خارج أوقاتك المتاحة' : 'ضمن أوقاتك المتاحة'}">${DAYS[mine.dow]} ${esc(C.fmtTime(at, TZ))}${ok === false ? ' ⚠' : ' ✓'}</span>`;
    }).join('');
  }
  function lastLessonHtml(s) {
    const x = (s.lessons || [])[0]; if (!x) return '<p class="muted">لم تُسجَّل حصص بعد.</p>';
    const f = (k, v) => v ? `<div class="fact"><small>${k}</small><b>${esc(v)}</b></div>` : '';
    return `<div class="facts">${f('آخر حصة', arDate(x.day))}${f('ملخص الدرس', x.summary)}${f('توقفنا عند', /^\d+:\d+$/.test(x.stop_at || '') ? 'سورة رقم ' + x.stop_at.split(':')[0] + ' · آية ' + x.stop_at.split(':')[1] : x.stop_at)}${f('الواجب', x.hw_from ? (x.hw_kind || '') + ' ' + x.hw_from + (x.hw_to ? ' – ' + x.hw_to : '') : '')}${f('السؤال المطلوب', x.question)}${f('التقدير', x.grade)}</div>`;
  }
  function stuActions(s) {
    if (/البحوث/.test(s.program || '')) return `<div class="stu-actions"><a class="btn" href="research.html?sub=${s.sub_id}">💬 لوحة المتابعة البحثية</a></div>`;
    if (s.status !== 'active') return '';
    return `<div class="stu-actions"><a class="btn" href="room.html?sub=${s.sub_id}&mode=video">🎥 دخول الغرفة</a><a class="btn ghost" href="room.html?sub=${s.sub_id}&mode=audio">🎧 حلقة صوتية</a><a class="btn ghost" href="lesson.html?sub=${s.sub_id}">📝 درس اليوم والواجب</a></div>`;
  }
  function stuHtml(s, av) {
    const b = ST[s.status] || ST.pending;
    const f = (k, v) => v ? `<div class="fact"><small>${k}</small><b>${esc(v)}</b></div>` : '';
    let h = `<div class="stu" id="s-${s.sub_id}"><div class="stu-top"><h2>${esc(s.first_name)}${s.age ? ` <small class="muted">(${esc(s.age)} سنة)</small>` : ''}</h2><span class="badge ${b[0]}">${b[1]}</span></div>`;
    if (s.health) h += `<div class="health">⚕ ظروف صحية خاصة: ${esc(s.health)}</div>`;
    h += stuActions(s);
    if (s.status === 'active' && !/البحوث/.test(s.program || '')) h += `<div data-callslot="${s.sub_id}"></div>`;
    h += `<div class="stu-sec"><h3>🕒 مواعيده (بتوقيتك)</h3><div>${slotsHtml(s, av)}</div></div>`;
    if (s.status === 'active') {
      const stt = C.stats(C.sessions(s, s.marks || {}, null, s.makeups));
      const fs = (k, v, n) => `<div class="fact"><small>${k}</small><b data-stat="${n}">${v}</b></div>`;
      h += `<div class="stu-sec"><h3>🗓 متابعة الحصص</h3><p class="muted" style="font-size:13.5px">اضغط/ي على يوم الحصة لتسجيل الحضور أو الغياب أو التأجيل والتعويض، وما أخذتموه والملاحظات. كل ما تسجّله/تسجّلينه يظهر في لوحة الطالب/ة.</p>
        <div class="facts" data-stats="${s.sub_id}">${fs('حضر', stt.done, 'done')}${fs('غياب', stt.absent, 'absent')}${fs('متبقية', stt.remaining, 'remaining')}${fs('مؤجلة', stt.postponed || 0, 'postponed')}${fs('الإجمالي', stt.total, 'total')}</div>
        <div data-attcal="${s.sub_id}"></div>`;
      h += `</div><div class="stu-sec"><h3>📖 آخر درس مسجّل</h3><div data-last>${lastLessonHtml(s)}</div></div>`;
    } else if (!/البحوث/.test(s.program || '')) h += `<p class="note" style="margin-top:10px">بانتظار تفعيل الإدارة لاشتراكه، ثم تظهر هنا الغرفة وتسجيل الحصص.</p>`;
    h += `<div class="stu-sec"><h3>📋 بيانات الاشتراك والطالب/ة</h3><div class="facts">${f('البرنامج', s.program)}${f('الخطة', s.plan)}${f('نوع الاشتراك', PER[s.period])}${s.ends_on ? f('ينتهي الاشتراك', arDate(s.ends_on)) : ''}${f('المستوى', s.level)}${f('مقدار الحفظ', s.hifz)}${f('مستوى التجويد', s.tajweed)}${f('التخصص العلمي', s.specialty)}${f('المهنة', s.job)}</div></div>`;
    return h + '</div>';
  }
  // الجدول الأسبوعي: مواعيد كل الطلاب (الفعّالين وبانتظار التفعيل) بتوقيت المعلم/ة، من السبت إلى الجمعة
  function weekHtml(students, av) {
    const today = new Date().toISOString().slice(0, 10), ref = C.addDays(today, -C.dow(today));
    const atz = (av && av.tz) || TZ, byDay = [[], [], [], [], [], [], []];
    students.forEach((s) => (Array.isArray(s.slots) ? s.slots : []).forEach((x) => {
      const at = C.zoned(C.addDays(ref, x.dow), x.time, s.slots_tz || 'Africa/Cairo'), mine = inTz(at, TZ), t = inTz(at, atz);
      const ok = av && Array.isArray(av.days) && Array.isArray(av.hours) ? av.days.includes(t.dow) && av.hours.includes(t.h) : true;
      const p = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hourCycle: 'h23', hour: 'numeric', minute: '2-digit' }).formatToParts(at);
      const mins = Number((p.find((y) => y.type === 'hour') || {}).value) % 24 * 60 + Number((p.find((y) => y.type === 'minute') || {}).value);
      byDay[mine.dow].push({ s, at, mins, ok });
    }));
    const todayDow = inTz(new Date(), TZ).dow;
    const order = [6, 0, 1, 2, 3, 4, 5];
    const total = byDay.reduce((a, d) => a + d.length, 0);
    if (!total) return '<p class="muted" style="margin-top:8px">لم تُحدَّد مواعيد لطلابك بعد.</p>';
    return '<div class="wk">' + order.map((d) => {
      const L = byDay[d].sort((a, b) => a.mins - b.mins);
      return `<div class="wk-day${d === todayDow ? ' today' : ''}${L.length ? '' : ' empty'}"><div class="wk-dn">${DAYS[d]}${d === todayDow ? '<small>اليوم</small>' : ''}${L.length ? `<small>${L.length} ${L.length === 1 ? 'حصة' : 'حصص'}</small>` : ''}</div><div class="wk-items">${L.length ? L.map(({ s, at, ok }) =>
        `<a class="wk-it${s.status === 'active' ? '' : ' pending'}${ok ? '' : ' warn'}" href="#stu-${esc(s.sub_id)}" title="${ok ? '' : 'خارج أوقاتك المتاحة'}"><b>${esc(C.fmtTime(at, TZ))}${ok ? '' : ' ⚠'}</b><span>${esc(s.first_name)}</span><small>${esc(String(s.program || '').replace(/^برنامج\s+/, ''))}</small></a>`).join('') : '<span class="muted" style="font-size:13px;padding-top:4px">لا حصص</span>'}</div></div>`;
    }).join('') + '</div><div class="wk-legend"><span><i style="background:#EEF4FB;border:1px solid #BFD3EA"></i>اشتراك فعّال</span><span><i style="background:#FFFBEB;border:1px solid #FCD34D"></i>بانتظار التفعيل</span><span>⚠ خارج أوقاتك المتاحة</span></div>';
  }
  function stuCard(s) {
    const b = ST[s.status] || ST.pending;
    let nx = ''; if (s.status === 'active') { const c = C.sessions(s, s.marks || {}, null, s.makeups).find((x) => x.at.getTime() + C.CLASS_MIN * 60000 > Date.now()); if (c) nx = DAYS[inTz(c.at, TZ).dow] + ' ' + C.fmtTime(c.at, TZ); }
    return `<a class="stu-card" href="#stu-${esc(s.sub_id)}"><span class="sc-av">${esc((s.first_name || '؟').trim().charAt(0))}</span><span class="sc-t"><b>${esc(s.first_name)}</b><small>${esc(s.program || '')}</small>${nx ? `<small>🕒 الحصة القادمة: ${esc(nx)}</small>` : ''}</span><span class="badge ${b[0]}">${b[1]}</span></a>`;
  }
  function upcomingHtml(students) {
    const now = Date.now(), wk = now + 7 * 86400000, all = [];
    students.filter((s) => s.status === 'active').forEach((s) => C.sessions(s, s.marks || {}, null, s.makeups).forEach((x) => { if (x.at.getTime() + C.CLASS_MIN * 60000 > now && x.at.getTime() < wk && x.status === 'upcoming') all.push({ s, x }); }));
    all.sort((a, b) => a.x.at - b.x.at);
    if (!all.length) return { n: 0, today: 0, html: '<p class="muted">لا حصص في الأيام السبعة القادمة.</p>' };
    const dkey = (d) => d.toLocaleDateString('en-CA', { timeZone: TZ });
    const today = dkey(new Date()), tmr = dkey(new Date(now + 86400000));
    const groups = []; all.forEach((e) => { const k = dkey(e.x.at); let g = groups.find((y) => y.k === k); if (!g) groups.push(g = { k, at: e.x.at, items: [] }); g.items.push(e); });
    const label = (g) => (g.k === today ? 'اليوم · ' : g.k === tmr ? 'غدًا · ' : '') + g.at.toLocaleDateString('ar-EG', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long' });

    for (let i = 0; i < h.length; i++) { let j = i; while (j + 1 < h.length && h[j + 1] === h[j] + 1) j++; out.push(i === j ? lb(h[i]) : lb(h[i]) + ' – ' + lb(h[j])); i = j; }
