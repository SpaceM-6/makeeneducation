<script>window.MN_CFG={site:"makeen",base:"https://maimoonah.com",app:"تطبيق MakeenEducation",icon:"assets/makeen-logo.jpeg",badge:"assets/makeen-logo.jpeg",today:"today.html",my:"my.html",logo:"#mk-no-header-flag"};</script>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  if (!window.supabase) { document.querySelector('main').innerHTML = '<div class="card">تعذّر الاتصال بالخادم. تأكد/ي من الإنترنت ثم حدّث/ي الصفحة.</div>'; throw new Error('no supabase'); }
  const sb = MN.sb();
  const C = window.MNClasses;
  const TZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Africa/Cairo'; } catch (e) { return 'Africa/Cairo'; } })();
  const DAYS = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  const MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
  const arDate = (d) => { if (!d) return '—'; const [y, m, day] = String(d).slice(0, 10).split('-').map(Number); return `${day} ${MONTHS[m - 1]} ${y}م`; };
  const hour12 = (h) => { const p = h < 12 ? 'ص' : 'م'; return (h % 12 || 12) + ' ' + p; };
  const PER = { monthly: 'شهري', yearly: 'سنوي' };
  const ST = { active: ['b-active', 'فعّال'], pending: ['b-pending', 'بانتظار التفعيل'], expired: ['b-expired', 'منتهٍ'] };
  const MARK = { done: 'حضر', absent: 'غياب', cancelled: 'أُلغيت', upcoming: 'قادمة' };
  let D = null;

  // الوقت في منطقة المعلم/ة
  const inTz = (date, tz) => { const p = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', weekday: 'short', hour: 'numeric', minute: '2-digit' }).formatToParts(date); const g = (t) => (p.find((x) => x.type === t) || {}).value; return { dow: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(g('weekday')), h: Number(g('hour')) % 24 }; };
  function slotsHtml(s, av) {
    if (!Array.isArray(s.slots) || !s.slots.length) return '<span class="muted">لم يحدد مواعيد بعد</span>';
    const today = new Date().toISOString().slice(0, 10), ref = C.addDays(today, -C.dow(today));
    const atz = (av && av.tz) || TZ;
    return s.slots.slice().sort((a, b) => ((a.dow + 1) % 7) - ((b.dow + 1) % 7)).map((x) => {
      const at = C.zoned(C.addDays(ref, x.dow), x.time, s.slots_tz || 'Africa/Cairo');
      const mine = inTz(at, TZ), t = inTz(at, atz);
      const ok = av && Array.isArray(av.days) && Array.isArray(av.hours) ? av.days.includes(t.dow) && av.hours.includes(t.h) : null;
      return `<span class="slot ${ok === false ? 'no' : 'ok'}" title="${ok === false ? 'خارج أوقاتك المتاحة' : 'ضمن أوقاتك المتاحة'}">${DAYS[mine.dow]} ${esc(C.fmtTime(at, TZ))}${ok === false ? ' ⚠' : ' ✓'}</span>`;
    }).join('');
  }
  function lastLessonHtml(s) {
    const x = (s.lessons || [])[0]; if (!x) return '<p class="muted">لم تُسجَّل حصص بعد.</p>';
    const f = (k, v) => v ? `<div class="fact"><small>${k}</small><b>${esc(v)}</b></div>` : '';
    return `<div class="facts">${f('آخر حصة', arDate(x.day))}${f('ملخص الدرس', x.summary)}${f('توقفنا عند', /^\d+:\d+$/.test(x.stop_at || '') ? 'سورة رقم ' + x.stop_at.split(':')[0] + ' · آية ' + x.stop_at.split(':')[1] : x.stop_at)}${f('الواجب', x.hw_from ? (x.hw_kind || '') + ' ' + x.hw_from + (x.hw_to ? ' – ' + x.hw_to : '') : '')}${f('السؤال المطلوب', x.question)}${f('التقدير', x.grade)}</div>`;
  }
  function stuHtml(s, av) {
    const b = ST[s.status] || ST.pending;
    const f = (k, v) => v ? `<div class="fact"><small>${k}</small><b>${esc(v)}</b></div>` : '';
    let h = `<div class="stu" id="s-${s.sub_id}"><div class="stu-top"><h2>${esc(s.first_name)}${s.age ? ` <small class="muted">(${esc(s.age)} سنة)</small>` : ''}</h2><span class="badge ${b[0]}">${b[1]}</span></div>`;
    if (s.status === 'active' && !/البحوث/.test(s.program || '')) h += `<div data-callslot="${s.sub_id}"></div>`;
    if (s.health) h += `<div class="health">⚕ ظروف صحية خاصة: ${esc(s.health)}</div>`;
    h += `<div class="facts">${f('البرنامج', s.program)}${f('الخطة', s.plan)}${f('نوع الاشتراك', PER[s.period])}${f('المستوى', s.level)}${f('التخصص العلمي', s.specialty)}${f('المهنة', s.job)}${f('مقدار الحفظ', s.hifz)}${f('مستوى التجويد', s.tajweed)}${s.ends_on ? f('ينتهي الاشتراك', arDate(s.ends_on)) : ''}</div>`;
    h += `<h3>مواعيده (بتوقيتك)</h3><div>${slotsHtml(s, av)}</div>`;
    if (s.status === 'active') {
      const list = C.sessions(s, s.marks || {}), stt = C.stats(list);
      const fs = (k, v, n) => `<div class="fact"><small>${k}</small><b data-stat="${n}">${v}</b></div>`;
      h += `<h3>الحصص والحضور</h3><div class="facts" data-stats="${s.sub_id}">${fs('منجزة', stt.done, 'done')}${fs('متبقية', stt.remaining, 'remaining')}${fs('غياب', stt.absent, 'absent')}${fs('الإجمالي', stt.total, 'total')}</div>`;
      // حالة كل حصة يغيّرها المعلم/ة: حضر، غاب، أُلغيت (الحالية مظللة)
      const row = (x) => { const st = (s.marks || {})[x.day] || x.status, fut = x.at.getTime() > Date.now() + 3600000;
        const btn = (k, t, c) => `<button class="btn sm ${c}${st === k ? ' on' : ''}" data-mark="${k}" data-sub="${s.sub_id}" data-day="${x.day}" aria-pressed="${st === k}">${st === k ? '✓ ' : ''}${t}</button>`;
        return `<div class="sess"><span>${DAYS[inTz(x.at, TZ).dow]} ${arDate(x.day)} · ${esc(C.fmtTime(x.at, TZ))} — <b data-st="${st}">${MARK[st] || ''}</b></span><span>${fut ? '' : btn('done', 'حضر', 'green') + ' ' + btn('absent', 'غاب', 'red') + ' '}${btn('cancelled', 'أُلغيت', 'ghost')}</span></div>`; };
      const now = Date.now(), past = list.filter((x) => x.at.getTime() < now + 3600000).reverse(), next = list.filter((x) => x.at.getTime() >= now + 3600000);
      h += past.slice(0, 3).map(row).join('') + (next[0] ? row(next[0]) : '');
      if (past.length > 3 || next.length > 1) h += `<details class="all-sess"><summary>كل الحصص (${list.length}) — لتعديل أي حصة سابقة أو إلغاء حصة قادمة</summary>${past.slice(3).map(row).join('')}${next.slice(1).map(row).join('')}</details>`;
      h += `<h3>آخر حصة</h3>${lastLessonHtml(s)}`;
      if (/البحوث/.test(s.program || '')) h += `<div class="row-btns"><a class="btn" href="research.html?sub=${s.sub_id}">💬 لوحة المتابعة البحثية</a></div>`; else
      h += `<div class="row-btns"><a class="btn" href="room.html?sub=${s.sub_id}&mode=video">🎥 دخول الغرفة</a><a class="btn ghost" href="room.html?sub=${s.sub_id}&mode=audio">🎧 حلقة صوتية</a><a class="btn ghost" href="https://maimoonah.com/mushaf.html?sub=${s.sub_id}&lesson">📝 تسجيل الحصة والملخص والواجب</a></div>`;
    } else h += /البحوث/.test(s.program || '') ? `<div class="row-btns"><a class="btn" href="research.html?sub=${s.sub_id}">💬 لوحة المتابعة البحثية</a></div>` : `<p class="note" style="margin-top:10px">بانتظار تفعيل الإدارة لاشتراكه، ثم تظهر هنا الغرفة وتسجيل الحصص.</p>`;
    return h + '</div>';
  }
  function stuCard(s) {
    const b = ST[s.status] || ST.pending;
    let nx = ''; if (s.status === 'active') { const c = C.sessions(s, s.marks || {}).find((x) => x.at.getTime() + C.CLASS_MIN * 60000 > Date.now()); if (c) nx = DAYS[inTz(c.at, TZ).dow] + ' ' + C.fmtTime(c.at, TZ); }
    return `<a class="stu-card" href="#stu-${esc(s.sub_id)}"><span class="sc-av">${esc((s.first_name || '؟').trim().charAt(0))}</span><span class="sc-t"><b>${esc(s.first_name)}</b><small>${esc(s.program || '')}</small>${nx ? `<small>🕒 الحصة القادمة: ${esc(nx)}</small>` : ''}</span><span class="badge ${b[0]}">${b[1]}</span></a>`;
  }
  function upcomingHtml(students) {
    const now = Date.now(), wk = now + 7 * 86400000, all = [];
    students.filter((s) => s.status === 'active').forEach((s) => C.sessions(s, s.marks || {}).forEach((x) => { if (x.at.getTime() + C.CLASS_MIN * 60000 > now && x.at.getTime() < wk && x.status === 'upcoming') all.push({ s, x }); }));
    all.sort((a, b) => a.x.at - b.x.at);
    if (!all.length) return { n: 0, today: 0, html: '<p class="muted">لا حصص في الأيام السبعة القادمة.</p>' };
    const dkey = (d) => d.toLocaleDateString('en-CA', { timeZone: TZ });
    const today = dkey(new Date()), tmr = dkey(new Date(now + 86400000));
    const groups = []; all.forEach((e) => { const k = dkey(e.x.at); let g = groups.find((y) => y.k === k); if (!g) groups.push(g = { k, at: e.x.at, items: [] }); g.items.push(e); });
    const label = (g) => (g.k === today ? 'اليوم · ' : g.k === tmr ? 'غدًا · ' : '') + g.at.toLocaleDateString('ar-EG', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long' });
    const block = (g) => `<div class="up-day${g.k === today ? ' today' : ''}"><div class="up-h">${esc(label(g))} <small>(${g.items.length})</small></div>${g.items.map(({ s, x }) => `<a class="up" href="#stu-${esc(s.sub_id)}"><span class="up-t">${esc(C.fmtTime(x.at, TZ))}</span><span><b>${esc(s.first_name)}</b> <small>· ${esc(s.program)}</small></span></a>`).join('')}</div>`;
    const first = groups.slice(0, 2), rest = groups.slice(2);
    return { n: all.length, today: (groups[0] && groups[0].k === today) ? groups[0].items.length : 0,
      html: first.map(block).join('') + (rest.length ? `<details class="up-more"><summary>بقية الأسبوع (${rest.reduce((a, g) => a + g.items.length, 0)} حصة)</summary>${rest.map(block).join('')}</details>` : '') };
  }
  // الساعات المتتالية تُعرض نطاقًا: «9 ص – 7 م»
  function hoursRanges(hs) {
    const h = (hs || []).slice().sort((a, b) => a - b), out = [], lb = (x) => (x % 12 || 12) + ' ' + (x < 12 ? 'ص' : 'م');
    for (let i = 0; i < h.length; i++) { let j = i; while (j + 1 < h.length && h[j + 1] === h[j] + 1) j++; out.push(i === j ? lb(h[i]) : lb(h[i]) + ' – ' + lb(h[j])); i = j; }
    return out;
  }
  function render() {
    const t = D.teacher || {}, av = t.availability || null, S = D.students || [];
    const act = S.filter((s) => s.status === 'active'), up = upcomingHtml(S);
    const avTxt = window.MN && MN.availText ? MN.availText(av) : 'لم تُسجَّل';
    const days = av && av.days && av.days.length ? (av.days.length === 7 ? 'كل الأيام' : av.days.slice().sort().map((d) => DAYS[d]).join('، ')) : '';
    const TZN = { 'Africa/Cairo': 'مصر', 'Asia/Riyadh': 'السعودية', 'Asia/Dubai': 'الإمارات', 'Asia/Kuwait': 'الكويت', 'Asia/Qatar': 'قطر' };
    const avHtml = days ? `<div class="av-sum"><div><small>الأيام</small><b>${esc(days)}</b></div><div><small>الساعات${av.tz ? ' (بتوقيت ' + esc(TZN[av.tz] || av.tz) + ')' : ''}</small><span class="chips">${hoursRanges(av.hours).map((r) => `<span class="chip">${esc(r)}</span>`).join('')}</span></div></div>` : '<p class="muted">لم تُسجَّل بعد.</p>';
    const progs = t.programs || [];
    $('dash').innerHTML = `<section class="card hello-t"><h1>أهلًا ${esc(t.name || '')}</h1>${t.headline ? `<p class="muted">${esc(t.headline)}</p>` : ''}
      <div class="stats"><div class="stat"><b>${up.today}</b><small>حصة اليوم</small></div><div class="stat"><b>${up.n}</b><small>حصة في ٧ أيام</small></div><div class="stat"><b>${act.length}</b><small>طالب/ة مشترك/ة</small></div></div></section>
      <section class="card"><h2>📅 حصصك القادمة</h2>${up.html}</section>
      <section class="card"><h2>👥 طلابي <small class="muted">(${S.length}${S.length - act.length ? ' · ' + (S.length - act.length) + ' بانتظار التفعيل' : ''})</small></h2>
      ${S.length ? '<div class="stu-cards">' + S.map(stuCard).join('') + '</div>' : '<p class="note">لم يُسند إليك طلاب بعد. تظهر هنا بيانات طلابك فور إسنادهم إليك من الإدارة.</p>'}
      <p class="muted" style="margin-top:10px;font-size:13px">تظهر لك بيانات الدراسة فقط، ويُمنع تبادل أرقام الهواتف أو الحسابات الشخصية مع الطلاب. المواعيد بعلامة ⚠ خارج أوقاتك المتاحة؛ راجع/ي الإدارة فيها.</p></section>
      <section class="card"><h2>🕒 أوقاتي المتاحة</h2>${avHtml}<div class="row-btns"><button type="button" class="btn sm ghost" id="avEdit">✏️ تعديل أوقاتي</button></div></section>
      <section class="card"><h2>🎓 ملفي</h2><div class="facts">${t.level ? `<div class="fact"><small>المؤهل</small><b>${esc(t.level)}</b></div>` : ''}${t.specialty ? `<div class="fact"><small>التخصص</small><b>${esc(t.specialty)}</b></div>` : ''}</div>
      ${progs.length ? `<details class="progs"><summary>برامجي (${progs.length})</summary><div class="chips">${progs.map((p) => `<span class="chip">${esc(String(p).replace(/^برنامج\s+/, ''))}</span>`).join('')}</div></details>` : ''}
      ${t.id ? `<div class="row-btns"><a class="btn ghost" href="teacher.html?id=${encodeURIComponent(t.id)}">صفحتي التعريفية</a></div>` : ''}</section>`;
    // صفحة بيانات الطالب: تُفتح من بطاقته (#stu-…) ولها زر رجوع
    const sid = (location.hash.match(/^#stu-(.+)$/) || [])[1], cur = sid && S.find((x) => String(x.sub_id) === sid);
    if (cur) {
      $('dash').innerHTML = `<div class="row-btns" style="margin:0 0 10px"><a class="btn ghost" href="#">→ طلابي</a></div>` + stuHtml(cur, av);
      window.scrollTo(0, 0);
    }
    { const ab = $('avEdit'); if (ab) ab.onclick = () => MN.availEdit(D.teacher.availability, async (nv) => {
      const r = await sb.rpc('teacher_set_availability', { p: nv });
      if (r.error) return /function|does not exist|schema cache/i.test(r.error.message || '') ? 'هذه الخاصية تُفعَّل بعد أن تشغّل الإدارة ملف التحديث.' : 'تعذّر الحفظ، حاول/ي مرة أخرى.';
      if (r.data !== 'ok') return 'تعذّر الحفظ: هذا البريد غير مربوط بصفحة معلم/ة.';
      D.teacher.availability = nv; render(); if (window._mkPaintCall) window._mkPaintCall(); return null;
    }); }
    document.querySelectorAll('[data-mark]').forEach((b) => b.onclick = async () => {
      if (b.classList.contains('on')) return;
      const row = b.closest('.sess'), sub = b.dataset.sub, day = b.dataset.day, k = b.dataset.mark;
      // يتغيّر اللون فورًا في مكانه، ثم يُحفظ (ويرجع إن تعذّر الحفظ)
      const prev = row.querySelector('[data-mark].on');
      const paint = (on) => { row.querySelectorAll('[data-mark]').forEach((x) => { const a = x === on; x.classList.toggle('on', a); x.setAttribute('aria-pressed', a); x.textContent = (a ? '✓ ' : '') + x.textContent.replace(/^✓ /, ''); }); const lb = row.querySelector('b[data-st]'); if (lb) { const kk = on ? on.dataset.mark : 'upcoming'; lb.dataset.st = kk; lb.textContent = MARK[kk] || ''; } };
      paint(b);
      const { error } = await sb.rpc('teacher_mark', { p_sub: sub, p_day: day, p_status: k });
      if (error) { paint(prev); alert('تعذّر الحفظ، حاول/ي مرة أخرى.'); return; }
      const st = D.students.find((x) => String(x.sub_id) === sub); if (!st) return;
      st.marks = Object.assign({}, st.marks || {}, { [day]: k });
      const box = document.querySelector(`[data-stats="${sub}"]`); if (box) { const t = C.stats(C.sessions(st, st.marks)); ['done', 'remaining', 'absent', 'total'].forEach((n) => { const e = box.querySelector(`[data-stat="${n}"]`); if (e) e.textContent = t[n]; }); }
    });
  }
  window.addEventListener('hashchange', () => { if (D) { render(); if (window._mkPaintCall) window._mkPaintCall(); } });
  async function load() {
    const { data, error } = await sb.rpc('teacher_dashboard');
    if (error) { $('dash').innerHTML = '<section class="card">تعذّر تحميل لوحتك الآن، حدّث/ي الصفحة بعد قليل.</section>'; return; }
    if (!data || data.error) { $('dash').innerHTML = `<section class="card"><h1>هذا البريد غير مسجّل في كادر مكين</h1><p class="muted">ادخل/ي بالبريد الذي كتبته في طلب الانضمام، أو تواصل/ي مع الإدارة.</p><div class="row-btns"><a class="btn ghost" href="join.html">طلب الانضمام إلى كادر مكين</a></div></section>`; return; }
    D = data;
    // الأوقات المتاحة المحفوظة (يعدّلها المعلم/ة بنفسه/ا)
    try { const av = await sb.rpc('teacher_availability'); if (!av.error && av.data && av.data.days) D.teacher.availability = av.data; } catch (e) {}
    render();
    // الاتصال الصوتي بالطالب/ة في وقت الحلقة
    const act = (D.students || []).filter((x) => x.status === 'active');
    MN.callSetup(sb, { role: 'teacher', myName: 'أ/ ' + ((D.teacher && D.teacher.name) || ''), subs: act.map((x) => ({ id: x.sub_id, peer: x.first_name, title: x.program })) });
    // رنين المكالمات على هذا الجهاز ولو كان التطبيق مغلقًا: ربط الجهاز ببريد المعلم/ة وتفعيل الإشعارات
    (async () => { try {
      if (!window.MNApp) return;
      const p = MNApp.profile() || {}; if (!p.done) MNApp.saveProfile(Object.assign(p, { done: true, name: (D.teacher && D.teacher.name) || '', gender: D.teacher && D.teacher.gender === 'f' ? 'f' : 'm', role: D.teacher && D.teacher.gender === 'f' ? 'tf' : 'tm' }));
      const { data: { session } } = await sb.auth.getSession(); if (!session) return;
      const link = () => MNApp.linkStudent(session.access_token);
      if ('Notification' in window && Notification.permission === 'granted') { link(); return; }
      if (document.getElementById('ringBox')) return;
      const box = document.createElement('section'); box.className = 'card'; box.id = 'ringBox';
      box.innerHTML = '<b>🔔 فعّل/ي رنين المكالمات على هذا الجهاز</b><p class="muted">حتى يرنّ جوالك حين يتصل بك طالب، ولو كان التطبيق مغلقًا.</p><div class="row-btns"><button class="btn green" type="button">تفعيل الرنين</button></div>';
      box.querySelector('button').onclick = async () => { const r = await MNApp.enableNotifications(); await link(); box.innerHTML = r === 'push' || r === 'local' ? '<b>✓ فُعّل رنين المكالمات على هذا الجهاز.</b>' : '<b>لم يُسمح بالإشعارات.</b><p class="muted">اسمح/ي بالإشعارات لهذا الموقع من إعدادات المتصفح ثم أعد/أعيدي المحاولة.</p>'; };
      $('dash').prepend(box);
    } catch (e) {} })();
    const paintCall = () => act.forEach((x) => { const el = document.querySelector(`[data-callslot="${x.sub_id}"]`); if (el) el.innerHTML = `<div class="mk-trow"><span><small>الاتصال الصوتي بالطالب/ة</small><b>${esc(x.first_name)}</b></span>${MN.callButton(x, x.sub_id, x.first_name, x.program)}</div>`; });
    window._mkPaintCall = paintCall; paintCall(); if (!window._mkCallT) window._mkCallT = setInterval(() => window._mkPaintCall(), 60000);
  }
  async function boot() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { $('loginBox').hidden = false; MN.pwMount($('loginBox'), sb, { title: 'لوحة المعلم في مكين', intro: 'ادخل/ي بالبريد الإلكتروني أو رقم الجوال الذي سجّلت به في طلب الانضمام إلى كادر مكين، وكلمة المرور.' }); return; }
    await MN.pwGate(sb, session);
    $('logoutBtn').hidden = false; $('pwBtn').hidden = false; $('dash').hidden = false;
    $('dash').innerHTML = '<section class="card">جارٍ التحميل…</section>';
    load();
  }
  $('logoutBtn').onclick = async () => { await sb.auth.signOut(); location.reload(); };
  sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_IN' && !$('loginBox').hidden) location.reload(); });
  boot();
</script>
</body>
