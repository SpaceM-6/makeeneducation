<script>
  // مشاركة الشهادة على وسائل التواصل: إضافتها إلى LinkedIn، والنشر على فيسبوك وإكس وثريدز، وإنستغرام عبر مشاركة الهاتف
  window.mnLinkedIn = function (c) {
    const url = 'https://maimoonah.com/cert.html?c=' + encodeURIComponent(c.serial);
    const name = (c.kind === 'ijaza' ? 'إجازة قرآنية: ' : 'شهادة إتمام: ') + c.title;
    const txt = (c.kind === 'ijaza' ? 'بفضل الله حصلت على ' : 'بفضل الله أتممت وحصلت على ') + name + ' من منصة ميمونة التربوية التعليمية — شركة مكين. للتحقق من صحتها:';
    const d = String(c.issued_on || '').split('-'), E = encodeURIComponent;
    const add = 'https://www.linkedin.com/profile/add?startTask=CERTIFICATION_NAME&name=' + E(name) + '&organizationName=' + E('منصة ميمونة التربوية التعليمية — شركة مكين') +
      (d[0] ? '&issueYear=' + d[0] : '') + (d[1] ? '&issueMonth=' + (+d[1]) : '') + '&certUrl=' + E(url) + '&certId=' + E(c.serial);
    const ic = (p) => `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="${p}"/></svg>`;
    const I = { li: 'M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05C20.6 8.65 21 11.2 21 14.5V21h-4v-5.8c0-1.4-.03-3.2-1.95-3.2-1.95 0-2.25 1.5-2.25 3.1V21H9z',
      fb: 'M14 8V6.5c0-.7.5-1.2 1.2-1.2H17V2h-2.8C11.6 2 10 3.7 10 6.1V8H7.5v3.3H10V22h4V11.3h2.8l.5-3.3z',
      x: 'M17.5 3h3.2l-7 8 8.3 10h-6.5l-5.1-6.3L4.6 21H1.4l7.5-8.6L1 3h6.6l4.6 5.8zm-1.1 16.1h1.8L7.7 4.8H5.8z',
      th: 'M16.9 11.2c-.1 0-.2-.1-.3-.1-.2-2.9-1.8-4.5-4.4-4.5-1.6 0-2.9.7-3.7 1.9l1.5 1c.6-.9 1.5-1.1 2.2-1.1 1.4 0 2.2.8 2.4 2.1-.6-.1-1.2-.1-1.9-.1-2.6.1-4.3 1.6-4.2 3.6.1 1.9 1.8 3.1 3.9 3 2.7-.1 4-2.3 4.2-4.6.8.5 1.3 1.2 1.5 2 .4 1.4.1 3-1.3 4.4-1.3 1.3-2.8 1.9-5 1.9-2.5 0-4.4-.8-5.6-2.4-1.1-1.5-1.7-3.6-1.7-6.2s.6-4.7 1.7-6.2C7.4 4.3 9.3 3.5 11.8 3.5s4.5.8 5.8 2.4c.6.8 1.1 1.8 1.4 2.9l1.8-.5c-.4-1.4-1-2.6-1.8-3.6C17.4 2.6 14.9 1.6 11.8 1.6 8.7 1.6 6.4 2.6 4.9 4.6 3.5 6.4 2.8 8.9 2.8 12s.7 5.6 2.1 7.4c1.5 2 3.8 3 6.9 3 2.7 0 4.6-.7 6.3-2.4 2.1-2.1 2-4.7 1.3-6.3-.5-1.1-1.4-2-2.5-2.5zm-4.7 4.4c-1.1.1-2.2-.4-2.3-1.4 0-.8.6-1.6 2.3-1.7h.6c.5 0 1 0 1.4.1-.2 2.2-1.1 2.9-2 3z',
      ig: 'M12 2.2c3.2 0 3.6 0 4.8.1 3.2.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 3.2-1.7 4.8-4.9 4.9-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-3.3-.1-4.8-1.7-4.9-4.9C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8C2.4 3.9 3.9 2.4 7.2 2.3 8.4 2.2 8.8 2.2 12 2.2zm0 4.7a5.1 5.1 0 1 0 0 10.2 5.1 5.1 0 0 0 0-10.2zm0 8.4a3.3 3.3 0 1 1 0-6.6 3.3 3.3 0 0 1 0 6.6zm5.3-9.8a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z' };
    const a = (h, cls, i, t) => `<a class="li-btn ${cls}" target="_blank" rel="noopener" href="${h}">${ic(I[i])} ${t}</a>`;
    return `<span class="li-btns">` +
      a(add, '', 'li', 'أضف/يفي إلى LinkedIn') +
      a('https://www.linkedin.com/sharing/share-offsite/?url=' + E(url), 'sh li', 'li', 'LinkedIn') +
      a('https://www.facebook.com/sharer/sharer.php?u=' + E(url), 'sh fb', 'fb', 'فيسبوك') +
      a('https://twitter.com/intent/tweet?text=' + E(txt) + '&url=' + E(url), 'sh x', 'x', 'إكس') +
      a('https://www.threads.net/intent/post?text=' + E(txt + ' ' + url), 'sh th', 'th', 'ثريدز') +
      `<button type="button" class="li-btn sh ig" data-ig-url="${url}" data-ig-txt="${txt.replace(/"/g, '&quot;')}" onclick="mnShareIG(this)">${ic(I.ig)} إنستغرام</button></span>`;
  };
  // إنستغرام لا يتيح المشاركة من رابط: نفتح قائمة المشاركة في الهاتف (فيها إنستغرام)، وإلا ننسخ النص والرابط
  window.mnShareIG = async function (b) {
    const url = b.dataset.igUrl, text = b.dataset.igTxt;
    try { if (navigator.share) { await navigator.share({ title: 'شهادتي', text: text, url: url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(text + ' ' + url); } catch (e) {}
    b.textContent = '✓ نُسخ النص والرابط: الصقه/يه في منشورك أو قصتك على إنستغرام';
  };
</script>

<body data-daily-popup data-app-bar>
<header class="mk-top"><a class="mk-brand" href="index.html"><img src="assets/makeen-logo.jpeg" alt="شعار شركة مكين"><span>شركة مكين</span></a><button type="button" class="mk-menu-btn" onclick="mkOpenDrawer()" aria-label="القائمة"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></header>
<main>
  <h1>شهاداتي وإجازاتي</h1>
  <p class="lead">إجازاتك القرآنية المسندة وشهادات دوراتك المختومة، تحمّلها/تحمّلينها بصيغة PDF في أي وقت.</p>
  <div id="login"></div>
  <div id="list"></div>
</main>
<script src="https://maimoonah.com/js/vendor/supabase-2.45.4.js"></script>
<script src="https://maimoonah.com/js/sb.js?v=c7"></script>
<script src="https://maimoonah.com/js/pwlogin.js?v=9"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const E = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const AR = (s) => String(s).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
  const sb = window.supabase && MN.sb ? MN.sb() : null; if (!sb) return;
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { MN.pwMount($('login'), sb, { title: 'ادخل/ي بحسابك', intro: 'ادخل/ي بالبريد نفسه الذي سجّلت به في الدورة أو الإجازة، فتظهر شهاداتك هنا.' }); return; }
  const { data, error } = await sb.from('certificates').select('serial,kind,holder,title,issued_on,revoked').order('created_at', { ascending: false });
  if (error) { $('list').innerHTML = '<div class="empty">تعذّر التحميل، حاول/ي مرة أخرى.</div>'; return; }
  const mine = (data || []).filter((c) => !c.revoked);
  $('list').innerHTML = mine.length ? mine.map((c) => `<div class="card"><span class="ic">${c.kind === 'ijaza' ? '📜' : '🎓'}</span><div><b>${c.kind === 'ijaza' ? 'إجازة قرآنية مسندة' : 'شهادة إتمام دورة'}</b>${E(c.title)}<br><small>${E(c.holder)} · ${AR(String(c.issued_on).split('-').reverse().join('/'))} · <span class="ltr">${E(c.serial)}</span></small></div>
    <a class="btn" href="${window.MAIN_SITE}/${c.kind === 'ijaza' ? 'ijaza.html?c=' : 'cert.html?print=1&c='}${encodeURIComponent(c.serial)}">عرض وتحميل PDF</a>${c.revoked ? '' : mnLinkedIn(c)}</div>`).join('')
    : '<div class="empty">لا توجد شهادات أو إجازات في حسابك بعد. حين تصدر لك تظهر هنا مباشرة بإذن الله.</div>';
})();
</script>
<script src="https://maimoonah.com/js/track.js?v=1" defer></script>
<script id="mkGold">/* توحيد ذهبي الشريط العلوي مع ذهبي القائمة الجانبية (#C9A45C) في كل صفحات مكين */
(function () {
  var BRIGHT = /243, 211, 122|229, 193, 88/, G = '#C9A45C', G2 = '#B8935A';
  function fix() {
    document.querySelectorAll('header, header *, .mk-top, .mk-top *').forEach(function (e) {
      var c = getComputedStyle(e);
      if (BRIGHT.test(c.color)) e.style.setProperty('color', G, 'important');
      if (BRIGHT.test(c.backgroundColor)) e.style.setProperty('background-color', G, 'important');
      if (BRIGHT.test(c.backgroundImage)) e.style.setProperty('background-image', 'linear-gradient(90deg,' + G + ',' + G2 + ')', 'important');
      ['Top', 'Right', 'Bottom', 'Left'].forEach(function (s) {
        if (BRIGHT.test(c['border' + s + 'Color'])) e.style.setProperty('border-' + s.toLowerCase() + '-color', G, 'important');
      });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fix); else fix();
  window.addEventListener('load', function () { fix(); setTimeout(fix, 1500); });
})();
</script>
