<header>
  <a class="home" data-back href="index.html">→ الموقع الرسمي</a>
  <a href="index.html" aria-label="الصفحة الرئيسية"><img src="https://maimoonah.com/img/maimouna-icon.webp" alt="شعار ميمونة"></a>
</header>
<div id="main">
  <div class="tip" style="margin-top:8px" id="notifTip" hidden><span>🔔 فعّل/ي التنبيهات ليصلك الرد فورًا.</span><button type="button" id="notifBtn">تفعيل</button></div>
  <section class="card" id="loginBox" hidden></section>

  <section class="chat" id="chat" hidden>
    <div class="chat-head"><button class="back" id="backBtn" hidden aria-label="رجوع إلى الرسائل">→</button><img src="https://maimoonah.com/img/maimouna-logo-square.webp" alt="" id="chatAv"><div><b id="chatName">أ/ ميمونة</b><small id="chatSub">تردّ في أقرب وقت بإذن الله</small></div></div>
    <div class="stream" id="stream" aria-live="polite"></div>
    <form class="composer" id="composer" onsubmit="send(event)">
      <textarea id="box" rows="1" placeholder="اكتب/ي رسالتك…" aria-label="نص الرسالة" maxlength="4000"></textarea>
      <button type="submit" id="sendMsg" aria-label="إرسال" disabled><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:scaleX(-1)"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg></button>
    </form>
  </section>

  <section class="inbox" id="inbox" hidden>
    <h1 style="margin:4px 0 8px" id="inboxTitle">الرسائل</h1>
    <div class="inbox-tools"><input type="search" id="tq" placeholder="بحث بالاسم أو البريد" aria-label="بحث"><button class="btn" id="newChat" type="button" style="white-space:nowrap">محادثة جديدة</button></div>
    <div id="threads"></div>
  </section>
</div>

<script>
  // مراسلة إدارة مكين (?site=makeen) منفصلة عن مراسلة أ/ ميمونة
  var SITE = 'makeen';
  var MK = SITE === 'makeen';
  var Q = (extra) => { const u = new URLSearchParams(extra || ''); if (MK) u.set('site', 'makeen'); const s = u.toString(); return s ? '?' + s : location.pathname; };
  if (MK) {
    document.title = 'مراسلة إدارة مكين | شركة مكين';
    document.querySelector('header .home').textContent = '→ موقع مكين'; document.querySelector('header .home').href = 'index.html';
    document.querySelector('header a[aria-label]').href = 'index.html';
    document.querySelector('header img').src = 'assets/makeen-logo.jpeg'; document.querySelector('header img').alt = 'شعار شركة مكين';
    document.getElementById('chatAv').src = 'assets/makeen-logo.jpeg'; document.getElementById('chatName').textContent = 'إدارة مكين'; document.getElementById('chatSub').textContent = 'تردّ في أقرب وقت بإذن الله';
    const st = document.createElement('style'); st.textContent = ":root{--gold:#F3D37A!important}body{background:#F8F9FA url('assets/marble.webp') 0 0/1400px auto repeat!important}.card,.chat-head,.composer,.th{background:rgba(255,255,255,.96)!important}";
    document.head.appendChild(st); document.documentElement.classList.add('mk-ready');
  }
</script>

<script>window.MN_CFG={site:"makeen",base:"https://maimoonah.com",app:"تطبيق MakeenEducation",icon:"assets/makeen-logo.jpeg",badge:"assets/makeen-logo.jpeg",today:"today.html",my:"my.html",logo:"#mk-no-header-flag"};</script>

<script>
  if (!window.supabase) { document.getElementById('main').innerHTML = '<div class="card" style="text-align:center">تعذّر الاتصال بالخادم. تأكد/ي من اتصالك بالإنترنت، ثم حدّث/ي الصفحة.</div>'; throw new Error('supabase not loaded'); }
  const sb = MN.sb();
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const P = (window.MNApp && MNApp.profile()) || {};
  const G = (m, f) => P.gender === 'f' ? f : P.gender === 'm' ? m : m + '/ي';
  const AR = (n) => String(n).replace(/[0-9]/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
  const MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
  const tm = (iso) => new Date(iso).toLocaleTimeString('ar-EG', { hour: 'numeric', minute: '2-digit' });
  const dayKey = (iso) => new Date(iso).toLocaleDateString('en-CA');
  const dayLabel = (iso) => { const k = dayKey(iso), t = dayKey(new Date().toISOString()), y = dayKey(new Date(Date.now() - 86400000).toISOString()); if (k === t) return 'اليوم'; if (k === y) return 'أمس'; const d = new Date(iso); return `${AR(d.getDate())} ${MONTHS[d.getMonth()]}`; };
  let ME = null, ADMIN = false, THREAD = null, MSGS = [], THREADS = [], chan = null;

  $('box').placeholder = G('اكتب', 'اكتبي') + ' رسالتك…';

  // ===== الدخول =====
  // ===== عرض الرسائل =====
  function renderStream(keepPos) {
    const st = $('stream'), atBottom = st.scrollHeight - st.scrollTop - st.clientHeight < 80;
    if (!MSGS.length) {
      st.innerHTML = ADMIN ? '<div class="empty-chat">لا رسائل في هذه المحادثة بعد. اكتبي رسالتك الأولى.</div>'
        : `<div class="empty-chat"><img src="${MK ? 'assets/makeen-logo.jpeg' : 'https://maimoonah.com/img/maimouna-logo-square.jpg'}" alt=""><p><b style="color:var(--navy)">أهلًا ${esc((P.name || '').split(/\s+/)[0] || 'بك')}</b><br>${G('اكتب', 'اكتبي')} سؤالك أو ما ${G('تريد', 'تريدين')} قوله ${MK ? 'لإدارة مكين' : 'للمعلمة'}، ويصلك الرد هنا بإذن الله.</p></div>`;
      return;
    }
    let h = '', last = '';
    MSGS.forEach((m) => {
      const k = dayKey(m.created_at); if (k !== last) { h += `<div class="day">${dayLabel(m.created_at)}</div>`; last = k; }
      const mine = ADMIN ? m.sender === 'admin' : m.sender === 'user';
      h += `<div class="bub ${mine ? 'me' : 'them'}${m.pending ? ' pending' : ''}">${esc(m.body)}<span class="tm">${m.pending ? 'جارٍ الإرسال…' : tm(m.created_at)}${mine && !m.pending ? ' <b>' + (m.read_at ? '✓✓' : '✓') + '</b>' : ''}</span></div>`;
    });
    st.innerHTML = h;
    if (!keepPos || atBottom) st.scrollTop = st.scrollHeight;
  }
  async function loadMessages() {
    const { data, error } = await sb.from('chat_messages').select('id,sender,body,created_at,read_at').eq('thread_id', THREAD).eq('site', SITE).order('id', { ascending: true }).limit(500);
    if (error) { $('stream').innerHTML = '<div class="empty-chat">لم تُفعَّل المراسلة بعد. حاول/ي لاحقًا.</div>'; return; }
    MSGS = data || []; renderStream(false); markRead();
  }
  let readT = null;
  function markRead() { clearTimeout(readT); readT = setTimeout(() => { if (document.hidden) return; sb.rpc('chat_read', ADMIN ? { p_thread: THREAD, p_site: SITE } : { p_site: SITE }).then(() => {}); }, 400); }
  function subscribe() {
    if (chan) sb.removeChannel(chan);
    chan = sb.channel('chat-' + SITE + '-' + (ADMIN ? 'admin' : THREAD))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_messages', filter: ADMIN ? undefined : 'thread_id=eq.' + THREAD }, (p) => {
        const r = p.new && p.new.id ? p.new : null;
        if (r && (r.site || 'maimouna') !== SITE) return;
        if (ADMIN) { loadThreads(); if (!r || r.thread_id !== THREAD) return; }
        if (!r) return;
        const i = MSGS.findIndex((m) => m.id === r.id);
        if (i >= 0) MSGS[i] = r; else { const pi = MSGS.findIndex((m) => m.pending && m.body === r.body); if (pi >= 0) MSGS[pi] = r; else MSGS.push(r); }
        renderStream(true); if ((ADMIN ? r.sender === 'user' : r.sender === 'admin') && !r.read_at) markRead();
      }).subscribe();
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && THREAD) { loadMessages(); if (ADMIN) loadThreads(); } });

  // ===== الإرسال =====
  const box = $('box');
  box.addEventListener('input', () => { box.style.height = 'auto'; box.style.height = Math.min(140, box.scrollHeight) + 'px'; $('sendMsg').disabled = !box.value.trim(); });
  box.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !/android|iphone|ipad/i.test(navigator.userAgent)) { e.preventDefault(); send(e); } });
  async function send(e) {
    if (e) e.preventDefault();
    const body = box.value.trim(); if (!body || !THREAD) return;
    box.value = ''; box.style.height = 'auto'; $('sendMsg').disabled = true;
    const tmp = { id: 'tmp' + Date.now(), sender: ADMIN ? 'admin' : 'user', body, created_at: new Date().toISOString(), pending: true };
    MSGS.push(tmp); renderStream(false);
    const { data, error } = await sb.rpc('chat_send', ADMIN ? { p_body: body, p_thread: THREAD, p_site: SITE } : { p_body: body, p_name: P.name || null, p_site: SITE });
    const i = MSGS.indexOf(tmp);
    if (error) {
      MSGS.splice(i, 1); renderStream(false); box.value = body; $('sendMsg').disabled = false;
      alertBar(error.message.includes('too_many') ? 'أرسلت/ِ رسائل كثيرة خلال ساعة، انتظر/ي قليلًا ثم أعد/أعيدي المحاولة.' : 'لم تُرسل الرسالة، تأكد/ي من الاتصال ثم أعد/أعيدي المحاولة.');
      return;
    }
    if (i >= 0 && MSGS[i].pending) { MSGS[i] = { ...tmp, id: data, pending: false }; renderStream(false); }
    if (!ADMIN && !MSGS.some((m) => m.sender === 'user' && m !== MSGS[i])) setTimeout(() => alertBar('وصلت رسالتك ✓ وسيصلك الرد هنا بإذن الله.', true), 300);
  }
  function alertBar(t, ok) { const d = document.createElement('div'); d.className = 'tip'; d.style.margin = '6px 14px'; d.style.background = ok ? '#DCFCE7' : '#FEF2F2'; d.style.borderColor = ok ? '#86EFAC' : '#FCA5A5'; d.textContent = t; $('composer').before(d); setTimeout(() => d.remove(), 5000); }

  // ===== صندوق الإدارة =====
  async function loadThreads() {
    const { data, error } = await sb.from('chat_threads').select('*').eq('site', SITE).order('last_at', { ascending: false }).limit(500);
    if (error) { $('threads').innerHTML = '<div class="note">لم تُفعَّل المراسلة بعد (شغّلي ملف messages.sql في Supabase).</div>'; return; }
    THREADS = data || []; renderThreads();
  }
  function renderThreads() {
    const q = $('tq').value.trim().toLowerCase();
    const rows = THREADS.filter((t) => !q || [t.name, t.email].join(' ').toLowerCase().includes(q));
    $('threads').innerHTML = rows.length ? rows.map((t) => `<button type="button" class="th${t.unread_admin ? ' unread' : ''}" data-t="${t.user_id}"><span class="av">${esc((t.name || t.email || '؟').trim().charAt(0))}</span><span class="bd"><b>${esc(t.name || t.email)}</b><span class="lb">${esc(t.last_body || '')}</span></span><span class="meta"><span>${dayLabel(t.last_at)} ${tm(t.last_at)}</span>${t.unread_admin ? `<span class="un">${AR(t.unread_admin)}</span>` : ''}</span></button>`).join('')
      : '<div class="note">لا رسائل بعد. حين يراسلك طالب تظهر محادثته هنا، ويصلك إشعار على جوالك.</div>';
    $('threads').querySelectorAll('[data-t]').forEach((b) => b.onclick = () => openThread(b.dataset.t));
    const total = THREADS.reduce((s, t) => s + (t.unread_admin || 0), 0); document.title = (total ? `(${total}) ` : '') + (MK ? 'رسائل مكين | الإدارة' : 'الرسائل | maimoonah.com');
  }
  $('tq').oninput = renderThreads;
  async function openThread(id) {
    THREAD = id; const t = THREADS.find((x) => x.user_id === id) || {};
    $('chatName').textContent = t.name || t.email || ''; $('chatSub').textContent = t.email || ''; $('chatAv').hidden = true;
    $('inbox').hidden = true; $('chat').hidden = false; $('backBtn').hidden = false;
    try { history.pushState({ t: id }, '', Q('t=' + id)); } catch (e) {}
    MSGS = []; $('stream').innerHTML = ''; await loadMessages(); box.focus();
  }
  function closeThread() { THREAD = null; $('chat').hidden = true; $('inbox').hidden = false; loadThreads(); }
  $('backBtn').onclick = () => { try { history.back(); } catch (e) { closeThread(); } };
  window.addEventListener('popstate', () => { if (ADMIN) { const t = new URLSearchParams(location.search).get('t'); if (t) openThread(t); else closeThread(); } });
  $('newChat').onclick = async () => {
    const em = (window.prompt ? prompt('بريد الطالب الذي تريدين مراسلته:') : '') || '';
    if (!em.trim()) return;
    const { data, error } = await sb.rpc('chat_start', { p_email: em.trim(), p_site: SITE });
    if (error) { alert(error.message.includes('no_account') ? 'هذا البريد لم يدخل إلى الموقع بعد، فلا يمكن مراسلته هنا حتى يدخل مرة واحدة.' : 'تعذّر: ' + error.message); return; }
    await loadThreads(); openThread(data);
  };

  // ===== التنبيهات =====
  function notifTip() {
    if (!window.MNApp) return;
    const st = MNApp.notifyState();
    if (st === 'push' || st === 'unsupported' || st === 'denied') return;
    $('notifTip').hidden = false; $('notifTip').querySelector('span').textContent = '🔔 ' + (ADMIN ? 'فعّلي التنبيهات لتصلك رسائل الطلاب فورًا.' : G('فعّل', 'فعّلي') + ' التنبيهات ليصلك الرد فورًا.');
    $('notifBtn').onclick = async () => {
      const go = async () => { $('notifBtn').disabled = true; await MNApp.enableNotifications(); const { data: { session } } = await sb.auth.getSession(); if (session) await MNApp.linkStudent(session.access_token); $('notifTip').hidden = true; };
      const p = MNApp.profile(); if (!p || !p.done) MNApp.onboard({ onDone: go }); else go();
    };
  }

  async function boot() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      $('loginBox').hidden = false;
      MN.pwMount($('loginBox'), sb, MK
        ? { title: 'مراسلة إدارة مكين', intro: 'راسل/ي إدارة شركة مكين مباشرة، ويصلك الرد هنا وفي إشعار على جوالك. ادخل/ي بالبريد الإلكتروني أو رقم الجوال المسجّل، وكلمة المرور.' }
        : { title: 'مراسلة المعلمة', intro: 'راسل/ي أ/ ميمونة مباشرة، ويصلك ردّها هنا وفي إشعار على جوالك. ادخل/ي بالبريد الإلكتروني أو رقم الجوال المسجّل، وكلمة المرور.' });
      return;
    }
    await MN.pwGate(sb, session);
    ME = session.user; ADMIN = (ME.email || '').toLowerCase() === MN.ADMIN_EMAIL;
    if (ADMIN) await MNMfa.ensure(sb);
    if (window.MNApp) MNApp.linkStudent(session.access_token);
    notifTip();
    subscribe();
    if (ADMIN) {
      if (MK) $('inboxTitle').textContent = 'رسائل إدارة مكين';
      $('inbox').hidden = false; await loadThreads();
      const t = new URLSearchParams(location.search).get('t'); if (t) openThread(t);
      return;
    }
    THREAD = ME.id; $('chat').hidden = false; await loadMessages();
  }
  sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_IN' && !$('loginBox').hidden) location.reload(); });
  boot();
</script>
<script>
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[data-back]');
    if (!a) return;
    try { if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) { e.preventDefault(); history.back(); } } catch (x) {}
  });
</script>

<script id="mkGold">/* توحيد ذهبي الشريط العلوي مع ذهبي القائمة الجانبية (#C9A45C) في كل صفحات مكين */
(function () {
  var BRIGHT = /243, 211, 122|229, 193, 88/, G = '#C9A45C', G2 = '#B8935A';
  function fix() {
    document.querySelectorAll('header, header *, .mk-top, .mk-top *').forEach(function (e) {
      var c = getComputedStyle(e);
      if (BRIGHT.test(c.color)) e.style.setProperty('color', G, 'important');
      if (BRIGHT.test(c.backgroundColor)) e.style.setProperty('background-color', G, 'important');
      if (BRIGHT.test(c.backgroundImage)) e.style.setProperty('background-image', 'linear-gradient(90deg,' + G + ',' + G2 + ')', 'important');
      ['Top', 'Right', 'Bottom', 'Left'].forEach(function (s) {
        if (BRIGHT.test(c['border' + s + 'Color'])) e.style.setProperty('border-' + s.toLowerCase() + '-color', G, 'important');
      });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fix); else fix();
  window.addEventListener('load', function () { fix(); setTimeout(fix, 1500); });
})();
</script>
